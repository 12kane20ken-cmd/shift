          <div class="staff-card" data-staff-id="${s.id}">
            <div class="staff-name">${escapeHtml(s.name)} ${groupTag}</div>
            <div class="staff-meta">${timeStr} ／ ${holidayStr}</div>
          </div>
        `;
      });
    }
  });
  container.innerHTML = html;

  // クリックで編集（ドラッグ直後のクリックは無視）
  container.querySelectorAll('.staff-card').forEach(card => {
    card.addEventListener('click', () => {
      if (staffDragSuppressClick) return;
      const id = parseInt(card.dataset.staffId);
      openStaffModal(id);
    });
  });

  // 長押しドラッグで並び替え（初回のみ初期化）
  attachStaffDragReorder(container);
}

/* ===== スタッフの長押しドラッグ並び替え =====
 * 350ms 長押しでドラッグ開始。同じ属性（カテゴリ）内でのみ入れ替え可能。
 * 並び順は state.staff の配列順で、カレンダーの行順にも反映される。 */
let staffDragSuppressClick = false;

function attachStaffDragReorder(container) {
  if (container._dragInit) return; // リスナーはコンテナに1回だけ（再描画で消えない）
  container._dragInit = true;

  const LONG_PRESS_MS = 350;
  const MOVE_CANCEL_PX = 8;
  let drag = null; // { staffId, category, card, startX, startY, lastX, lastY, timer, active, ghost, dropTarget, scrollEl }

  function findScrollable(el) {
    let cur = el;
    while (cur && cur !== document.body) {
      if (cur.scrollHeight > cur.clientHeight + 4) return cur;
      cur = cur.parentElement;
    }
    return null;
  }

  function clearIndicators() {
    container.querySelectorAll('.drop-before, .drop-after').forEach(c =>
      c.classList.remove('drop-before', 'drop-after'));
  }

  function cleanup() {
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.ghost) drag.ghost.remove();
    if (drag.card) drag.card.classList.remove('drag-source');
    clearIndicators();
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    drag = null;
  }

  function activate() {
    if (!drag) return;
    drag.active = true;
    drag.card.classList.add('drag-source');
    drag.scrollEl = findScrollable(container);
    // ゴースト作成
    const rect = drag.card.getBoundingClientRect();
    const ghost = drag.card.cloneNode(true);
    ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${drag.lastY - rect.height / 2}px;width:${rect.width}px;margin:0;z-index:10000;pointer-events:none;opacity:0.92;box-shadow:0 8px 20px rgba(0,0,0,.25);background:#fff;`;
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    updateDropTarget();
  }

  function updateDropTarget() {
    clearIndicators();
    drag.dropTarget = null;
    const y = drag.lastY;
    // 同カテゴリのカードのみ対象（自分自身は除く）
    const cards = Array.from(container.querySelectorAll('.staff-card')).filter(c => {
      const id = parseInt(c.dataset.staffId);
      if (id === drag.staffId) return false;
      const st = state.staff.find(x => x.id === id);
      return st && st.category === drag.category;
    });
    if (cards.length === 0) return;
    // ポインタYに最も近いカードを選び、中心より上なら before / 下なら after
    let best = null, bestDist = Infinity;
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      const dist = Math.abs(y - mid);
      if (dist < bestDist) { bestDist = dist; best = { card: c, before: y < mid }; }
    });
    if (best) {
      best.card.classList.add(best.before ? 'drop-before' : 'drop-after');
      drag.dropTarget = { id: parseInt(best.card.dataset.staffId), before: best.before };
    }
  }

  function onMove(e) {
    if (!drag) return;
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;
    if (!drag.active) {
      // 長押し前に動きすぎたらキャンセル（通常クリック/スクロール扱い）
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) > MOVE_CANCEL_PX) cleanup();
      return;
    }
    e.preventDefault();
    // ゴースト追従
    drag.ghost.style.top = `${e.clientY - drag.ghost.offsetHeight / 2}px`;
    // 端に近づいたら自動スクロール
    if (drag.scrollEl) {
      const r = drag.scrollEl.getBoundingClientRect();
      if (e.clientY < r.top + 30) drag.scrollEl.scrollTop -= 10;
      else if (e.clientY > r.bottom - 30) drag.scrollEl.scrollTop += 10;
    }
    updateDropTarget();
  }

  function onUp() {
    if (!drag) return;
    if (drag.active && drag.dropTarget) {
      const fromIdx = state.staff.findIndex(x => x.id === drag.staffId);
      const [moved] = state.staff.splice(fromIdx, 1);
      let toIdx = state.staff.findIndex(x => x.id === drag.dropTarget.id);
      if (!drag.dropTarget.before) toIdx++;
      state.staff.splice(toIdx, 0, moved);
      staffDragSuppressClick = true;
      setTimeout(() => { staffDragSuppressClick = false; }, 80);
      cleanup();
      saveState();
      renderAll();
      return;
    }
    if (drag.active) {
      // ドラッグしたがドロップ先なし → クリック扱いにしない
      staffDragSuppressClick = true;
      setTimeout(() => { staffDragSuppressClick = false; }, 80);
    }
    cleanup();
  }

  function onCancel() { cleanup(); }

  container.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const card = e.target.closest('.staff-card');
    if (!card || !container.contains(card)) return;
    const id = parseInt(card.dataset.staffId);
    const s = state.staff.find(x => x.id === id);
    if (!s) return;
    cleanup(); // 念のため前回の残骸を掃除
    drag = {
      staffId: id, category: s.category, card,
      startX: e.clientX, startY: e.clientY,
      lastX: e.clientX, lastY: e.clientY,
      active: false, ghost: null, dropTarget: null, scrollEl: null,
      timer: setTimeout(activate, LONG_PRESS_MS),
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  });

  // 長押し時のコンテキストメニュー・ネイティブドラッグを抑止
  container.addEventListener('contextmenu', (e) => { if (drag) e.preventDefault(); });
  container.addEventListener('dragstart', (e) => e.preventDefault());
}

function renderGroupList() {
  const container = document.getElementById('group-list');
  if (state.groups.length === 0) {
    container.innerHTML = '<div class="empty-msg">グループなし</div>';
    return;
  }
  let html = '';
  state.groups.forEach(g => {
    const members = state.staff.filter(s => s.groupId === g.id).map(s => s.name).join('・');
    html += `
      <div class="group-card" data-group-id="${g.id}">
        <div class="group-name">
          <span class="group-swatch" style="background:${groupSwatchBg(g.color)};border:1px solid ${groupSwatchBorder(g.color)}"></span>
          ${escapeHtml(g.name)}
        </div>
        <div class="group-members">${escapeHtml(members) || '（メンバーなし）'}</div>
      </div>
    `;
  });
  container.innerHTML = html;

  container.querySelectorAll('.group-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.groupId);
      openGroupModal(id);
    });
  });
}

function groupSwatchBg(color) {
  return { a: '#FFFBEB', b: '#F0FDF4', c: '#EFF6FF', d: '#FAF5FF' }[color] || '#F3F4F6';
}
function groupSwatchBorder(color) {
  return { a: '#FDE68A', b: '#BBF7D0', c: '#BFDBFE', d: '#DDD6FE' }[color] || '#D1D5DB';
}
function groupSwatchFg(color) {
  return { a: '#92400E', b: '#065F46', c: '#1E40AF', d: '#5B21B6' }[color] || '#374151';
}

function formatTime(h, m) {
  return `${h}:${String(m || 0).padStart(2, '0')}`;
}

/* ===== スタッフモーダル ===== */
function openStaffModal(staffId) {
  const isEdit = staffId != null;
  const s = isEdit ? state.staff.find(x => x.id === staffId) : null;

  const groupOptions = ['<option value="">グループなし</option>']
    .concat(state.groups.map(g => `<option value="${g.id}" ${s && s.groupId === g.id ? 'selected' : ''}>${escapeHtml(g.name)}</option>`))
    .join('');

  const catOptions = CATEGORIES.map(c =>
    `<option value="${c}" ${s && s.category === c ? 'selected' : (!s && c === '社員' ? 'selected' : '')}>${c}</option>`
  ).join('');

  const html = `
    <div class="modal-title">${isEdit ? 'スタッフ編集' : 'スタッフ追加'}</div>

    <div class="form-row">
      <label class="form-label">名前</label>
      <input type="text" class="form-input" id="sm-name" value="${s ? escapeHtml(s.name) : ''}" placeholder="例: 田中">
    </div>

    <div class="form-row">
      <label class="form-label">属性</label>
      <select class="form-select" id="sm-category">${catOptions}</select>
    </div>

    <div class="form-row-grid">
      <div class="form-row">
        <label class="form-label">出勤時刻</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="number" class="form-input" id="sm-start-h" min="0" max="23" value="${s ? s.startHour : 9}" style="width:60px;">
          <span>:</span>
          <input type="number" class="form-input" id="sm-start-m" min="0" max="59" step="5" value="${s ? (s.startMin || 0) : 0}" style="width:60px;">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">退勤時刻</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="number" class="form-input" id="sm-end-h" min="0" max="23" value="${s ? s.endHour : 18}" style="width:60px;">
          <span>:</span>
          <input type="number" class="form-input" id="sm-end-m" min="0" max="59" step="5" value="${s ? (s.endMin || 0) : 0}" style="width:60px;">
        </div>
      </div>
    </div>

    <div id="sm-external-note" style="display:none;background:#F3F4F6;border:1px solid #D1D5DB;border-radius:4px;padding:8px 10px;font-size:11px;color:#4B5563;line-height:1.6;margin-bottom:12px;">
      <strong>外部スタッフ</strong>は「出勤数」などの集計・違反判定・自動生成の対象外になります。<br>
      シフト表では出勤数の行より下に、参考用の行として表示されます（シフトは手入力してください）。
    </div>

    <div class="form-row-grid">
      <div class="form-row">
        <label class="form-label">月の基本休日数 <span id="sm-holiday-hint" style="font-weight:400;color:#6B7280;font-size:11px;"></span></label>
        <input type="number" class="form-input" id="sm-holiday" min="0" max="31" value="${s ? s.holidayBase : 10}">
      </div>
      <div class="form-row">
        <label class="form-label">週の休日数（最低）<span style="font-weight:400;color:#6B7280;font-size:11px;">　0で判定なし</span></label>
        <input type="number" class="form-input" id="sm-weekly-off" min="0" max="7" value="${s ? (typeof s.weeklyOff === 'number' ? s.weeklyOff : 2) : 2}">
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">グループ</label>
      <select class="form-select" id="sm-group">${groupOptions}</select>
    </div>

    <div class="form-row">
      <label class="form-label">固定休（曜日）<span style="font-weight:400;color:#6B7280;font-size:11px;">　ICスタッフ等の曜日固定休。前月コピー・自動生成でこの曜日は必ず休みになります</span></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;padding:4px 0;">
        ${['日','月','火','水','木','金','土'].map((w, i) =>
          `<label style="display:flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;${i === 0 ? 'color:#DC2626;' : i === 6 ? 'color:#2563EB;' : ''}"><input type="checkbox" class="sm-fixed-day" value="${i}" ${s && Array.isArray(s.fixedOffDays) && s.fixedOffDays.includes(i) ? 'checked' : ''}>${w}</label>`
        ).join('')}
      </div>
    </div>

    <div class="modal-actions">
      <div>${isEdit ? `<button class="btn btn-danger" id="sm-delete">削除</button>` : ''}</div>
      <div class="modal-actions-right">
        <button class="btn btn-secondary" id="sm-cancel">キャンセル</button>
        <button class="btn btn-primary" id="sm-save">保存</button>
      </div>
    </div>
  `;
  showModal(html);

  // カテゴリーに応じて休日数のヒント表示 / 外部スタッフの注意書き
  function updateHint() {
    const cat = document.getElementById('sm-category').value;
    const hint = document.getElementById('sm-holiday-hint');
    if (cat === '社員') hint.textContent = '（社員：基本10日）';
    else hint.textContent = '（個別設定）';
    const note = document.getElementById('sm-external-note');
    if (note) note.style.display = (cat === EXTERNAL_CATEGORY) ? 'block' : 'none';
  }
  document.getElementById('sm-category').addEventListener('change', updateHint);
  updateHint();

  document.getElementById('sm-cancel').addEventListener('click', closeModal);
  document.getElementById('sm-save').addEventListener('click', () => {
    const name = document.getElementById('sm-name').value.trim();
    if (!name) { showToast('名前を入力してください'); return; }
    const category = document.getElementById('sm-category').value;
    const startHour = parseInt(document.getElementById('sm-start-h').value) || 0;
    const startMin = parseInt(document.getElementById('sm-start-m').value) || 0;
    const endHour = parseInt(document.getElementById('sm-end-h').value) || 0;
    const endMin = parseInt(document.getElementById('sm-end-m').value) || 0;
    const holidayBase = parseInt(document.getElementById('sm-holiday').value) || 0;
    let weeklyOff = parseInt(document.getElementById('sm-weekly-off').value);
    if (isNaN(weeklyOff) || weeklyOff < 0) weeklyOff = 0;
    if (weeklyOff > 7) weeklyOff = 7;
    const groupIdRaw = document.getElementById('sm-group').value;
    const groupId = groupIdRaw === '' ? null : parseInt(groupIdRaw);
    const fixedOffDays = Array.from(document.querySelectorAll('.sm-fixed-day:checked')).map(el => parseInt(el.value));

    if (isEdit) {
      Object.assign(s, { name, category, startHour, startMin, endHour, endMin, holidayBase, weeklyOff, groupId, fixedOffDays });
    } else {
      state.staff.push({
        id: newStaffId(),
        name, category, startHour, startMin, endHour, endMin, holidayBase, weeklyOff, groupId, fixedOffDays,
      });
    }
    saveState();
    closeModal();
    renderAll();
  });

  if (isEdit) {
    document.getElementById('sm-delete').addEventListener('click', () => {
      closeModal();
      confirmDialog(
        `「${s.name}」を削除しますか？\nこのスタッフの全シフトデータも削除されます。\nこの操作は取り消せません。`,
        () => deleteStaff(staffId)
      );
    });
  }
}

function deleteStaff(staffId) {
  state.staff = state.staff.filter(s => s.id !== staffId);
  // 全月のシフトから削除
  Object.values(state.months).forEach(md => {
    Object.keys(md.shifts).forEach(k => {
      if (k.startsWith(`${staffId}_`)) delete md.shifts[k];
    });
    if (md.paidLeaves) delete md.paidLeaves[staffId];
  });
  saveState();
  renderAll();
  showToast('削除しました');
}

/* ===== グループモーダル ===== */
function openGroupModal(groupId) {
  const isEdit = groupId != null;
  const g = isEdit ? state.groups.find(x => x.id === groupId) : null;

  const usedColors = state.groups.filter(x => !g || x.id !== g.id).map(x => x.color);
  const availColors = GROUP_COLORS.filter(c => !usedColors.includes(c));
  const currentColor = g ? g.color : availColors[0];

  const colorOptions = GROUP_COLORS.map(c => {
    const disabled = (!g || g.color !== c) && usedColors.includes(c);
    const checked = c === currentColor;
    return `
      <label class="checkbox-row" style="${disabled ? 'opacity:0.4;pointer-events:none;' : 'cursor:pointer;'}">
        <input type="radio" name="gm-color" value="${c}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        <span class="group-swatch" style="background:${groupSwatchBg(c)};border:1px solid ${groupSwatchBorder(c)};"></span>
        色 ${c.toUpperCase()} ${disabled ? '(使用中)' : ''}
      </label>
    `;
  }).join('');

  let staffCheckboxes = '';
  // 外部スタッフはグループ（休みを被らせない）判定の対象外なので候補に出さない
  internalStaff().forEach(s => {
    const checked = (s.groupId === groupId);
    const disabled = (s.groupId != null && s.groupId !== groupId);
    staffCheckboxes += `
      <label class="checkbox-row" style="${disabled ? 'opacity:0.4;' : ''}">
        <input type="checkbox" name="gm-staff" value="${s.id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        ${escapeHtml(s.name)} <span style="color:#9CA3AF;font-size:11px;">（${escapeHtml(s.category)}）</span>
        ${disabled ? '<span style="color:#9CA3AF;font-size:11px;">他グループ所属</span>' : ''}
      </label>
    `;
  });
  if (!staffCheckboxes) staffCheckboxes = '<div class="empty-msg">スタッフを先に追加してください</div>';

  const html = `
    <div class="modal-title">${isEdit ? 'グループ編集' : 'グループ追加'}</div>

    <div class="form-row">
      <label class="form-label">グループ名</label>
      <input type="text" class="form-input" id="gm-name" value="${g ? escapeHtml(g.name) : ''}" placeholder="例: 早番">
    </div>

    <div class="form-row">
      <label class="form-label">色</label>
      ${colorOptions}
    </div>

    <div class="form-row">
      <label class="form-label">メンバー（休みを被らせない対象）</label>
      <div style="max-height:200px;overflow-y:auto;border:1px solid #E5E7EB;border-radius:4px;padding:8px;">
        ${staffCheckboxes}
      </div>
    </div>

    <div class="modal-actions">
      <div>${isEdit ? `<button class="btn btn-danger" id="gm-delete">削除</button>` : ''}</div>
      <div class="modal-actions-right">
        <button class="btn btn-secondary" id="gm-cancel">キャンセル</button>
        <button class="btn btn-primary" id="gm-save">保存</button>
      </div>
    </div>
  `;
  showModal(html);

  document.getElementById('gm-cancel').addEventListener('click', closeModal);
  document.getElementById('gm-save').addEventListener('click', () => {
    const name = document.getElementById('gm-name').value.trim();
    if (!name) { showToast('グループ名を入力してください'); return; }
    const color = document.querySelector('input[name="gm-color"]:checked')?.value || 'a';
    const memberIds = Array.from(document.querySelectorAll('input[name="gm-staff"]:checked'))
      .map(el => parseInt(el.value));

    if (isEdit) {
      g.name = name;
      g.color = color;
    } else {
      const newId = newGroupId();
      state.groups.push({ id: newId, name, color });
      groupId = newId;
    }

    // 既存メンバーから外し、新メンバーを設定
    state.staff.forEach(s => {
      if (s.groupId === groupId && !memberIds.includes(s.id)) s.groupId = null;
      if (memberIds.includes(s.id)) s.groupId = groupId;
    });

    saveState();
    closeModal();
    renderAll();
  });

  if (isEdit) {
    document.getElementById('gm-delete').addEventListener('click', () => {
      closeModal();
      confirmDialog(
        `グループ「${g.name}」を削除しますか？\n所属スタッフのグループ設定は外れます（スタッフ自体は削除されません）。`,
        () => deleteGroup(groupId)
      );
    });
  }
}

function deleteGroup(groupId) {
  state.groups = state.groups.filter(g => g.id !== groupId);
  state.staff.forEach(s => { if (s.groupId === groupId) s.groupId = null; });
  saveState();
  renderAll();
  showToast('削除しました');
}

</script>
<script>
/* ===== カレンダー描画 ===== */
function renderCalendar() {
  const ym = state.currentMonth;
  const days = daysInMonth(ym);
  const md = state.months[ym];
  const calendar = document.getElementById('calendar');

  // ヘッダー行
  let theadHtml = '<thead><tr>';
  theadHtml += '<th class="name-col">スタッフ</th>';
  for (let d = 1; d <= days; d++) {
    const dow = dayOfWeek(ym, d);
    const dowCls = dow === 0 ? 'day-sun' : (dow === 6 ? 'day-sat' : '');
    const weekStart = (dow === 0 && d > 1) ? ' week-start' : '';
    theadHtml += `<th class="${weekStart}">${d}<br><span class="day-num ${dowCls}">${DOW_LABELS[dow]}</span></th>`;
  }
  theadHtml += '<th class="holiday-col">月休<br>日数</th>';
  theadHtml += '</tr>';

  // 日別メモ行（2行・Excelには出力しない）
  const dayMemo = ensureDayMemo(md, ym);
  for (let mi = 0; mi < MEMO_ROWS; mi++) {
    theadHtml += `<tr class="memo-row"><td class="name-col">メモ${mi + 1}</td>`;
    for (let d = 1; d <= days; d++) {
      const v = dayMemo[mi][d - 1] || '';
      const dow = dayOfWeek(ym, d);
      const weekStart = (dow === 0 && d > 1) ? ' week-start' : '';
      const openLeft = (d > days - 5) ? ' open-left' : '';
      theadHtml += `<td class="memo-cell${weekStart}${openLeft}${v ? ' has-memo' : ''}">`
        + `<textarea class="day-memo" data-memo-row="${mi}" data-day="${d}" rows="2" spellcheck="false" maxlength="300"`
        + ` title="${escapeHtml(v)}">${escapeHtml(v)}</textarea></td>`;
    }
    theadHtml += '<td class="holiday-col"></td></tr>';
  }

  // 必要人数行（全体）
  theadHtml += '<tr class="req-row">';
  theadHtml += '<td class="name-col">必要人数</td>';
  for (let d = 1; d <= days; d++) {
    const v = md.requiredStaff[d - 1] || 0;
    const dow = dayOfWeek(ym, d);
    const weekStart = (dow === 0 && d > 1) ? ' week-start' : '';
    theadHtml += `<td class="${weekStart}"><input type="number" class="req-input" data-day="${d}" data-field="total" min="0" max="99" value="${v}"></td>`;
  }
  theadHtml += '<td class="holiday-col">―</td>';
  theadHtml += '</tr></thead>';

  // 本体（カテゴリーごとに区切り）
  let tbodyHtml = '<tbody>';

  // orderedStaffCache を再構築（カテゴリ順）
  orderedStaffCache = [];
  const byCat = {};
  CATEGORIES.forEach(c => byCat[c] = []);
  state.staff.forEach(s => {
    if (byCat[s.category]) byCat[s.category].push(s);
  });

  let rowIdx = 0;
  // ① 通常スタッフ（集計対象）
  INTERNAL_CATEGORIES.forEach(cat => {
    if (byCat[cat].length === 0) return;
    tbodyHtml += `<tr class="category-row"><td colspan="${days + 2}">${escapeHtml(cat)}</td></tr>`;
    byCat[cat].forEach(s => {
      orderedStaffCache.push(s);
      tbodyHtml += renderStaffRow(s, rowIdx, days, ym, md);
      rowIdx++;
    });
  });

  if (state.staff.length === 0) {
    tbodyHtml += `<tr><td colspan="${days + 2}" style="padding:30px;text-align:center;color:#9CA3AF;">左の＋ボタンからスタッフを追加してください</td></tr>`;
  } else {
    // ② 出勤数集計行（外部スタッフはカウントしない）
    const counted = internalStaff();
    tbodyHtml += '<tr class="summary-row"><td class="name-col">出勤数</td>';
    for (let d = 1; d <= days; d++) {
      let count = 0;
      counted.forEach(s => {
        if (isOnSite(s.id, d)) count++;
      });
      const req = md.requiredStaff[d - 1] || 0;
      const under = req > 0 && count < req && isMonthGenerated();
      const dow = dayOfWeek(ym, d);
      const weekStart = (dow === 0 && d > 1) ? ' week-start' : '';
      tbodyHtml += `<td class="${under ? 'summary-under' : ''}${weekStart}">${count}</td>`;
    }
    tbodyHtml += '<td class="holiday-col">―</td></tr>';
  }

  // ③ 外部スタッフ（出勤数の行より下・集計対象外の参考行）
  const externals = byCat[EXTERNAL_CATEGORY] || [];
  if (externals.length > 0) {
    tbodyHtml += `<tr class="category-row category-row-ext"><td colspan="${days + 2}">${escapeHtml(EXTERNAL_CATEGORY)}<span class="ext-note">出勤数にはカウントされません</span></td></tr>`;
    externals.forEach(s => {
      orderedStaffCache.push(s);
      tbodyHtml += renderStaffRow(s, rowIdx, days, ym, md);
      rowIdx++;
    });
  }

  tbodyHtml += '</tbody>';

  calendar.innerHTML = theadHtml + tbodyHtml;

  // イベントバインド
  bindCalendarEvents();
  updateSelectionUI();
}

function renderStaffRow(s, rowIndex, days, ym, md) {
  const external = isExternalStaff(s);
  const group = external ? null : state.groups.find(g => g.id === s.groupId);
  const tintClass = external ? 'ext-row' : (group ? `row-tint-${group.color}` : '');

  let html = `<tr class="${tintClass}" data-staff-id="${s.id}" data-row-index="${rowIndex}">`;
  html += `<td class="name-col">${escapeHtml(s.name)}</td>`;

  const isIC = s.category === 'ICスタッフ';
  for (let d = 1; d <= days; d++) {
    const type = getShift(s.id, d);
    const def = SHIFT_TYPES[type] || SHIFT_TYPES[''];
    const dow = dayOfWeek(ym, d);
    const weekStart = (dow === 0 && d > 1) ? ' week-start' : '';
    // ICスタッフの休みは希望休・通常休問わず赤字
    const icOffClass = (isIC && def.countAsHoliday) ? ' cell-ic-off' : '';
    html += `<td class="${weekStart}"><div class="cell ${def.class}${icOffClass}" data-staff-id="${s.id}" data-row-index="${rowIndex}" data-day="${d}">${def.text}</div></td>`;
  }

  // 月休日数表示: 実休数 / 規定休数（規定は編集可能）
  const expectedHoliday = s.holidayBase;
  const actualHoliday = countActualHolidays(s.id, days);
  // ぴったり以外（不足も超過も）を赤字強調
  const understaffed = actualHoliday !== expectedHoliday;

  // 外部スタッフは規定休数の判定をしないので、実休数だけ表示
  if (external) {
    html += `<td class="holiday-col"><span class="holiday-display">${actualHoliday}</span></td></tr>`;
    return html;
  }

  const holidayCellHtml = `
    <div style="display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;">
      <span class="holiday-display ${understaffed ? 'holiday-mismatch' : ''}" title="実休数 / 規定">${actualHoliday}</span>
      <span style="color:#9CA3AF;">/</span>
      <input type="number" class="holiday-base-input" data-staff-id="${s.id}" min="0" max="31" value="${expectedHoliday}" title="規定休日数（クリックで変更）">
    </div>
  `;
  html += `<td class="holiday-col">${holidayCellHtml}</td>`;
  html += '</tr>';
  return html;
}

function countActualHolidays(staffId, days) {
  let count = 0;
  for (let d = 1; d <= days; d++) {
    const type = getShift(staffId, d);
    if (SHIFT_TYPES[type] && SHIFT_TYPES[type].countAsHoliday) count++;
  }
  return count;
}

function bindCalendarEvents() {
  // セルのドラッグ選択 + クリック
  document.querySelectorAll('.cell[data-staff-id]').forEach(el => {
    el.addEventListener('mousedown', onCellMouseDown);
    el.addEventListener('mouseenter', onCellMouseEnter);
  });

  // 日別メモ（入力のたびに保存。再描画はしないので入力中にフォーカスが外れない）
  document.querySelectorAll('.day-memo').forEach(ta => {
    ta.addEventListener('input', () => {
      const md = state.months[state.currentMonth];
      if (!md) return;
      const memo = ensureDayMemo(md, state.currentMonth);
      const mi = parseInt(ta.dataset.memoRow);
      const day = parseInt(ta.dataset.day);
      memo[mi][day - 1] = ta.value;
      ta.title = ta.value;
      const td = ta.closest('td');
      if (td) td.classList.toggle('has-memo', ta.value !== '');
      clearTimeout(memoSaveTimer);
      memoSaveTimer = setTimeout(() => saveState(), 400);
    });
    ta.addEventListener('blur', () => {
      clearTimeout(memoSaveTimer);
      saveState();
      ta.scrollTop = 0;
    });
    ta.addEventListener('keydown', (e) => {
      // Enter で確定（改行は Shift+Enter）、Esc でも確定
      if ((e.key === 'Enter' && !e.shiftKey) || e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        ta.blur();
      }
    });
    ta.addEventListener('mousedown', (e) => e.stopPropagation()); // セル選択ドラッグと干渉させない
  });

  // 必要人数入力
  document.querySelectorAll('.req-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const day = parseInt(inp.dataset.day);
      const md = state.months[state.currentMonth];
      md.requiredStaff[day - 1] = parseInt(inp.value) || 0;
      saveState();
      renderCalendar();
      checkAndRenderViolations();
    });
  });

  // 月休日数の規定値（分母）編集
  document.querySelectorAll('.holiday-base-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const staffId = parseInt(inp.dataset.staffId);
      const staff = state.staff.find(s => s.id === staffId);
      if (!staff) return;
      const v = parseInt(inp.value);
      if (isNaN(v) || v < 0) { inp.value = staff.holidayBase; return; }
      staff.holidayBase = v;
      saveState();
      renderCalendar();
      renderSidebar();
      checkAndRenderViolations();
    });
  });
}

/* ===== ドラッグ選択ハンドラ ===== */

/* --- ドラッグ選択中の自動スクロール ---
 * 表の端（上下左右48px以内）までドラッグすると、その方向へ自動スクロールする。
 * スクロール中はmouseenterが発火しないため、ポインタ直下のセルを
 * elementFromPointで拾って選択範囲を更新し続ける。 */
let dragScrollRAF = null;
const dragMouse = { x: 0, y: 0 };

function onDragAutoScrollMove(e) {
  dragMouse.x = e.clientX;
  dragMouse.y = e.clientY;
}

function startDragAutoScroll() {
  const wrap = document.getElementById('calendar-wrap');
  if (!wrap || dragScrollRAF) return;
  document.addEventListener('mousemove', onDragAutoScrollMove);
  const EDGE = 48;      // 端からこの距離で自動スクロール開始
  const MAX_SPEED = 26; // 最大スクロール速度 px/frame

  function tick() {
    if (!isDragging) { stopDragAutoScroll(); return; }
    const r = wrap.getBoundingClientRect();
    let dx = 0, dy = 0;
    if (dragMouse.x < r.left + EDGE) dx = -Math.min(MAX_SPEED, (r.left + EDGE - dragMouse.x) * 0.4);
    else if (dragMouse.x > r.right - EDGE) dx = Math.min(MAX_SPEED, (dragMouse.x - (r.right - EDGE)) * 0.4);
    if (dragMouse.y < r.top + EDGE) dy = -Math.min(MAX_SPEED, (r.top + EDGE - dragMouse.y) * 0.4);
    else if (dragMouse.y > r.bottom - EDGE) dy = Math.min(MAX_SPEED, (dragMouse.y - (r.bottom - EDGE)) * 0.4);

    if (dx !== 0 || dy !== 0) {
      wrap.scrollLeft += dx;
      wrap.scrollTop += dy;

      // sticky固定の名前列・ヘッダーを避けた内側にクランプして、ポインタ位置のセルを拾う
      const nameCol = wrap.querySelector('.name-col');
      const thead = wrap.querySelector('thead');
      const innerLeft = nameCol ? nameCol.getBoundingClientRect().right + 2 : r.left + 4;
      const innerTop = thead ? thead.getBoundingClientRect().bottom + 2 : r.top + 4;
      const cx = Math.max(innerLeft, Math.min(r.right - 6, dragMouse.x));
      const cy = Math.max(innerTop, Math.min(r.bottom - 6, dragMouse.y));
      const el = document.elementFromPoint(cx, cy);
      const cell = el && el.closest ? el.closest('.cell[data-row-index]') : null;
      if (cell) {
        dragEnd = {
          row: parseInt(cell.dataset.rowIndex),
          day: parseInt(cell.dataset.day),
        };
        updateSelectionFromDrag();
      }
    }
    dragScrollRAF = requestAnimationFrame(tick);
  }
  dragScrollRAF = requestAnimationFrame(tick);
}

function stopDragAutoScroll() {
  if (dragScrollRAF) {
    cancelAnimationFrame(dragScrollRAF);
    dragScrollRAF = null;
  }
  document.removeEventListener('mousemove', onDragAutoScrollMove);
}

function onCellMouseDown(e) {
  if (e.button !== 0) return; // 左クリックのみ
  e.preventDefault();
  const cell = e.currentTarget;
  const row = parseInt(cell.dataset.rowIndex);
  const day = parseInt(cell.dataset.day);
  isDragging = true;
  dragStart = { row, day };
  dragEnd = { row, day };
  selectedCells.clear();
  selectedCells.add(`${row}_${day}`);
  updateSelectionUI();
  dragMouse.x = e.clientX;
  dragMouse.y = e.clientY;
  startDragAutoScroll();
}

function onCellMouseEnter(e) {
  if (!isDragging) return;
  const cell = e.currentTarget;
  dragEnd = {
    row: parseInt(cell.dataset.rowIndex),
    day: parseInt(cell.dataset.day),
  };
  updateSelectionFromDrag();
}

function onDocumentMouseUp(e) {
  if (!isDragging) return;
  isDragging = false;
  stopDragAutoScroll();

  const wasSingleClick = dragStart && dragEnd &&
    dragStart.row === dragEnd.row && dragStart.day === dragEnd.day;

  if (currentMode !== null) {
    applyModeToSelection(wasSingleClick);
    clearSelection();
  } else if (wasSingleClick) {
    // モードなし＆単セル → ピッカー表示
    const cell = document.querySelector(`.cell[data-row-index="${dragStart.row}"][data-day="${dragStart.day}"]`);
    if (cell) {
      const staff = orderedStaffCache[dragStart.row];
      if (staff) openCellPicker(cell, staff.id, dragStart.day);
    }
    clearSelection();
  }
  // 複数セル選択&モードなし → 選択状態保持（Delete待ち）
  dragStart = null;
  dragEnd = null;
}

function updateSelectionFromDrag() {
  if (!dragStart || !dragEnd) return;
  selectedCells.clear();
  const r1 = Math.min(dragStart.row, dragEnd.row);
  const r2 = Math.max(dragStart.row, dragEnd.row);
  const d1 = Math.min(dragStart.day, dragEnd.day);
  const d2 = Math.max(dragStart.day, dragEnd.day);
  for (let r = r1; r <= r2; r++) {
    for (let d = d1; d <= d2; d++) {
      selectedCells.add(`${r}_${d}`);
    }
  }
  updateSelectionUI();
}

function updateSelectionUI() {
  document.querySelectorAll('.cell.cell-selected').forEach(el => el.classList.remove('cell-selected'));
  selectedCells.forEach(key => {
    const [row, day] = key.split('_');
    const el = document.querySelector(`.cell[data-row-index="${row}"][data-day="${day}"]`);
    if (el) el.classList.add('cell-selected');
  });
}

function clearSelection() {
  selectedCells.clear();
  updateSelectionUI();
}

function applyModeToSelection(isSingleClick) {
  if (isSingleClick) {
    // 単セルクリック：トグル動作
    const key = Array.from(selectedCells)[0];
    if (!key) return;
    const [row, day] = key.split('_').map(Number);
    const staff = orderedStaffCache[row];
    if (!staff) return;
    const current = getShift(staff.id, day);
    if (current === currentMode) {
      // 同じ属性 → 消去
      setShift(staff.id, day, '');
    } else {
      setShift(staff.id, day, currentMode);
    }
  } else {
    // 複数セル：全部currentModeに上書き（消去モード=''なら全部クリア）
    selectedCells.forEach(key => {
      const [row, day] = key.split('_').map(Number);
      const staff = orderedStaffCache[row];
      if (!staff) return;
      setShift(staff.id, day, currentMode);
    });
  }
  saveState();
  renderCalendar();
  checkAndRenderViolations();
}

/* ===== モード管理 ===== */
function setMode(mode) {
  if (currentMode === mode) {
    currentMode = null; // 同じモードを再クリック → 解除
  } else {
    currentMode = mode;
  }
  clearSelection();
  updateModeBar();
  renderLegend();
}

function updateModeBar() {
  const bar = document.getElementById('mode-bar');
  if (currentMode === null) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  let label, hint;
  if (currentMode === '') {
    label = '消去';
    hint = 'クリックでセル消去・ドラッグで範囲一括消去';
  } else {
    const def = SHIFT_TYPES[currentMode];
    label = def.label;
    hint = `クリックで「${def.label}」入力・同じセル再クリックで消去・ドラッグで範囲一括入力`;
  }
  bar.innerHTML = `
    <span class="mode-bar-label">📝 入力モード: ${escapeHtml(label)}</span>
    <span class="mode-bar-hint">${escapeHtml(hint)}</span>
    <button class="mode-bar-exit" id="exit-mode-btn">解除 (ESC)</button>
  `;
  document.getElementById('exit-mode-btn').addEventListener('click', () => setMode(null));
}

/* ===== 凡例描画（モード切替UI） ===== */
function renderLegend() {
  const legend = document.getElementById('legend');
  const modes = [
    { mode: 'work',     label: '出勤',         color: '#DBEAFE', borderStyle: '' },
    { mode: 'off',      label: '休み',         color: '#FFFFFF', borderStyle: '' },
    { mode: 'holiday',  label: '希望休（確定）', color: '#FCE7F3', borderStyle: '' },
    { mode: 'required', label: '必須出勤（確定）', color: '#2563EB', borderStyle: '' },
    { mode: 'training', label: '研修',         color: '#FEF3C7', borderStyle: '' },
    { mode: '',         label: '消去',         color: '#FFFFFF', borderStyle: 'border:1px dashed #9CA3AF' },
  ];

  let html = '<span class="legend-hint">クリックで入力モード:</span>';
  modes.forEach(m => {
    const active = currentMode === m.mode;
    const swatch = `<span class="legend-swatch" style="background:${m.color};${m.borderStyle}"></span>`;
    html += `<button type="button" class="legend-item ${active ? 'active' : ''}" data-mode="${m.mode}">${swatch}${escapeHtml(m.label)}</button>`;
  });
  html += `<span class="legend-item legend-violation" style="margin-left:8px;"><span class="legend-swatch" style="background:#FFF;outline:2px solid #DC2626;outline-offset:-2px"></span>違反</span>`;
  legend.innerHTML = html;

  legend.querySelectorAll('.legend-item[data-mode]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      setMode(btn.dataset.mode);
    });
  });
}

/* ===== セル種別ピッカー ===== */
function openCellPicker(cellEl, staffId, day) {
  // 既存ピッカーを閉じる
  document.querySelectorAll('.cell-picker').forEach(p => p.remove());

  const current = getShift(staffId, day);
  const picker = document.createElement('div');
  picker.className = 'cell-picker';
  picker.innerHTML = `
    <button class="cell-picker-option" data-type=""><span class="cell-picker-swatch" style="background:#FFF"></span>未設定</button>
    <button class="cell-picker-option" data-type="work"><span class="cell-picker-swatch" style="background:#DBEAFE"></span>出勤</button>
    <button class="cell-picker-option" data-type="off"><span class="cell-picker-swatch" style="background:#FFF"></span>休み</button>
    <button class="cell-picker-option" data-type="holiday"><span class="cell-picker-swatch" style="background:#FCE7F3"></span>希望休 🔒</button>
    <button class="cell-picker-option" data-type="required"><span class="cell-picker-swatch" style="background:#2563EB"></span>必須出勤 🔒</button>
    <button class="cell-picker-option" data-type="training"><span class="cell-picker-swatch" style="background:#FEF3C7"></span>研修</button>
  `;

  document.body.appendChild(picker);

  const rect = cellEl.getBoundingClientRect();
  let top = rect.bottom + 4;
  let left = rect.left;
  // 画面外回避
  const ph = picker.offsetHeight;
  const pw = picker.offsetWidth;
  if (top + ph > window.innerHeight) top = rect.top - ph - 4;
  if (left + pw > window.innerWidth) left = window.innerWidth - pw - 8;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';

  // 現在の選択を強調
  picker.querySelectorAll('.cell-picker-option').forEach(btn => {
    if (btn.dataset.type === current) {
      btn.style.background = '#EFF6FF';
      btn.style.fontWeight = '700';
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setShift(staffId, day, btn.dataset.type);
      saveState();
      picker.remove();
      renderCalendar();
      checkAndRenderViolations();
    });
  });

  // 外クリックで閉じる
  setTimeout(() => {
    const handler = (e) => {
      if (!picker.contains(e.target)) {
        picker.remove();
        document.removeEventListener('click', handler);
      }
    };
    document.addEventListener('click', handler);
  }, 0);
}

</script>
<script>
/* ===== 違反検出 ===== */
function detectViolations() {
  const violations = [];
  const ym = state.currentMonth;
  const days = daysInMonth(ym);
  const md = state.months[ym];
  // 集計・判定対象（外部スタッフは対象外）
  const staffList = internalStaff();

  // 1. 4連勤以上チェック（★前月末・翌月頭からの連続もカウント）
  staffList.forEach(s => {
    const { carryIn, carryOut } = getCarryStreaks(s.id, ym);
    let cur = null; // { days: [], len }
    for (let d = 1; d <= days + 1; d++) {
      const isWork = d <= days && isOnSite(s.id, d);
      if (isWork) {
        if (!cur) cur = { days: [], len: 0 };
        cur.days.push(d);
        cur.len++;
      } else if (cur) {
        const fromPrev = (cur.days[0] === 1) && carryIn > 0;
        const toNext = (cur.days[cur.days.length - 1] === days) && carryOut > 0;
        if (fromPrev) cur.len += carryIn;
        if (toNext) cur.len += carryOut;
        if (cur.len >= 4) {
          const first = cur.days[0];
          const last = cur.days[cur.days.length - 1];
          const span = (first === last) ? `${first}日` : `${first}日〜${last}日`;
          const label = `${fromPrev ? '前月から' : ''}${span}${toNext ? '翌月へ' : ''}`;
          violations.push({
            type: 'consecutive',
            staffId: s.id,
            staffName: s.name,
            days: cur.days.slice(),
            message: `${s.name} ${label}（${cur.len}連勤）`,
          });
        }
        cur = null;
      }
    }
  });

  // 2. 週の休日数チェック（スタッフごとの設定値・日〜土の暦週）
  //    ★月を跨ぐ週は、前月・翌月のシフトも合わせて判定する
  //      （隣の月にこの人のデータが無い場合だけは判定できないのでスキップ）
  const { month: curMonthNum } = parseMonth(ym);
  const prevMonthNum = parseMonth(prevMonthKey(ym)).month;
  const nextMonthNum = parseMonth(nextMonthKey(ym)).month;
  staffList.forEach(s => {
    const minWeekOff = (typeof s.weeklyOff === 'number') ? s.weeklyOff : 2;
    if (minWeekOff <= 0) return; // 0 は判定なし
    const carryW = getWeekCarryHolidays(s.id, ym);

    // 各日が属する週の日曜日の日付でグルーピング（月外なら 0 以下 / 月末超え）
    const weeks = {};
    for (let d = 1; d <= days; d++) {
      const sundayDay = d - dayOfWeek(ym, d);
      if (!weeks[sundayDay]) weeks[sundayDay] = { sunday: sundayDay, holidays: 0, days: [] };
      const def = SHIFT_TYPES[getShift(s.id, d)];
      if (def && def.countAsHoliday) weeks[sundayDay].holidays++;
      weeks[sundayDay].days.push(d);
    }

    Object.keys(weeks).forEach(k => {
      const w = weeks[k];
      let total = w.holidays;
      let label;
      if (w.days.length === 7) {
        label = `${w.days[0]}日週`;
      } else if (w.sunday < 1) {
        // 前月から続く週
        if (carryW.head == null) return;
        total += carryW.head;
        label = `${prevMonthNum}/${carryW.headFrom}〜${curMonthNum}/${w.days[w.days.length - 1]}の週`;
      } else {
        // 翌月へ続く週
        if (carryW.tail == null) return;
        total += carryW.tail;
        label = `${curMonthNum}/${w.days[0]}〜${nextMonthNum}/${carryW.tailTo}の週`;
      }
      if (total < minWeekOff) {
        violations.push({
          type: 'week_holiday',
          staffId: s.id,
          staffName: s.name,
          days: w.days,
          message: `${s.name} ${label}（${total}日休 < 週${minWeekOff}休）`,
        });
      }
    });
  });

  // 3. 日別現場人数不足 ＋ 時間帯ごとの最低人数（6:30に3人以上／8:00時点で5人以上 など）
  const coverRules = activeCoverageRules();
  for (let d = 1; d <= days; d++) {
    const req = md.requiredStaff[d - 1] || 0;
    let onSite = 0;
    staffList.forEach(s => {
      if (isOnSite(s.id, d)) onSite++;
    });
    if (req > 0 && onSite < req) {
      violations.push({
        type: 'understaffed',
        day: d,
        message: `${d}日 現場人数不足（必要${req}・実${onSite}）`,
      });
    }
    // 社員必要人数
    const reqEmp = state.minEmployees || 0;
    if (reqEmp > 0) {
      let onSiteEmp = 0;
      staffList.forEach(s => {
        if (s.category === '社員' && isOnSite(s.id, d)) onSiteEmp++;
      });
      if (onSiteEmp < reqEmp) {
        violations.push({
          type: 'employee_short',
          day: d,
          message: `${d}日 社員不足（必要${reqEmp}・実${onSiteEmp}）`,
        });
      }
    }
    // 時間帯カバレッジ
    for (const rule of coverRules) {
      let cnt = 0;
      staffList.forEach(s => {
        if (isOnSite(s.id, d) && isStaffPresentAt(s, rule.t)) cnt++;
      });
      if (cnt < rule.min) {
        violations.push({
          type: 'coverage',
          day: d,
          time: rule.time,
          message: `${d}日 ${rule.time}時点の人数不足（必要${rule.min}・実${cnt}）`,
        });
      }
    }
  }

  // 4. 月休日数の不一致（不足＝出勤過多、超過＝出勤不足。どちらも違反）
  staffList.forEach(s => {
    const expected = s.holidayBase;
    const actual = countActualHolidays(s.id, days);
    if (actual < expected) {
      violations.push({
        type: 'holiday_mismatch',
        staffId: s.id,
        staffName: s.name,
        message: `${s.name} 月休日数不足 ${actual} < 規定 ${expected}（出勤数が規定より多い）`,
      });
    } else if (actual > expected) {
      violations.push({
        type: 'holiday_mismatch',
        staffId: s.id,
        staffName: s.name,
        message: `${s.name} 月休日数超過 ${actual} > 規定 ${expected}（出勤数が規定より少ない）`,
      });
    }
  });

  // 4.5 固定休曜日なのに出勤
  staffList.forEach(s => {
    const fixed = s.fixedOffDays || [];
    if (fixed.length === 0) return;
    for (let d = 1; d <= days; d++) {
      const w = dayOfWeek(state.currentMonth, d);
      if (!fixed.includes(w)) continue;
      const def = SHIFT_TYPES[getShift(s.id, d)];
      if (def && def.countAsWork) {
        violations.push({
          type: 'fixed_off_conflict',
          staffId: s.id,
          staffName: s.name,
          message: `${s.name} ${d}日(${'日月火水木金土'[w]}) 固定休曜日に出勤`,
        });
      }
    }
  });

  // 5. グループ同日休み
  state.groups.forEach(g => {
    const members = staffList.filter(s => s.groupId === g.id);
    if (members.length < 2) return;
    for (let d = 1; d <= days; d++) {
      const offMembers = members.filter(s => {
        const t = getShift(s.id, d);
        const def = SHIFT_TYPES[t];
        return def && def.countAsHoliday;
      });
      if (offMembers.length >= 2) {
        violations.push({
          type: 'group_overlap',
          groupId: g.id,
          day: d,
          staffIds: offMembers.map(s => s.id),
          message: `グループ${g.name} 同日休 ${d}日（${offMembers.map(s => s.name).join('・')}）`,
        });
      }
    }
  });

  return violations;
}

function isWorkDay(staffId, day) {
  const t = getShift(staffId, day);
  const def = SHIFT_TYPES[t];
  return def && def.countAsWork;
}

function range(a, b) {
  const arr = [];
  for (let i = a; i <= b; i++) arr.push(i);
  return arr;
}

/* ===== 違反描画 ===== */
function checkAndRenderViolations() {
  const container = document.getElementById('violations');

  // 既存の赤枠を全クリア
  document.querySelectorAll('.cell.cell-violation').forEach(c => c.classList.remove('cell-violation'));
  document.querySelectorAll('.req-cell-violation').forEach(c => c.classList.remove('req-cell-violation'));

  // 生成前は違反非表示（パネルも赤枠も）
  if (!isMonthGenerated()) {
    container.classList.add('hidden');
    return;
  }

  const violations = detectViolations();
  const list = document.getElementById('violations-list');
  const header = document.getElementById('violations-header');

  if (violations.length === 0) {
    container.classList.add('hidden');
  } else {
    container.classList.remove('hidden');
    header.textContent = `⚠ 違反 ${violations.length}件`;
    list.innerHTML = violations.map(v =>
      `<div class="violation-item">${escapeHtml(v.message)}</div>`
    ).join('');
  }

  violations.forEach(v => {
    if (v.type === 'consecutive' && v.staffId && v.days) {
      v.days.forEach(d => {
        const el = document.querySelector(`.cell[data-staff-id="${v.staffId}"][data-day="${d}"]`);
        if (el) el.classList.add('cell-violation');
      });
    } else if (v.type === 'group_overlap' && v.day && v.staffIds) {
      v.staffIds.forEach(sid => {
        const el = document.querySelector(`.cell[data-staff-id="${sid}"][data-day="${v.day}"]`);
        if (el) el.classList.add('cell-violation');
      });
    } else if (v.type === 'week_holiday' && v.staffId && v.days) {
      v.days.forEach(d => {
        const el = document.querySelector(`.cell[data-staff-id="${v.staffId}"][data-day="${d}"]`);
        if (el) el.classList.add('cell-violation');
      });
    }
    // 'understaffed' は出勤数集計行で赤くなるだけ。必要人数行は触らない
  });
}

</script>
<script>
/* ===== シフト自動生成 ===== */
async function generateShifts() {
  const ym = state.currentMonth;
  const days = daysInMonth(ym);
  const md = state.months[ym];
  if (!md.requiredEmployee) md.requiredEmployee = new Array(days).fill(0);

  if (state.staff.length === 0) {
    showToast('スタッフを追加してください');
    return;
  }
  if (internalStaff().length === 0) {
    showToast('外部スタッフ以外のスタッフを追加してください（外部スタッフは自動生成の対象外です）', 4000);
    return;
  }

  // ロック系セルのスナップショット
  const lockedSnapshot = {};
  state.staff.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const t = getShift(s.id, d);
      const def = SHIFT_TYPES[t];
      if (def && (def.locked || t === 'training')) {
        lockedSnapshot[`${s.id}_${d}`] = t;
      }
    }
  });
  // ★固定休曜日もロック扱いで 'off' を配置（希望休等の明示セルが優先）
  state.staff.forEach(s => {
    if (isExternalStaff(s)) return;
    const fixed = s.fixedOffDays || [];
    if (fixed.length === 0) return;
    for (let d = 1; d <= days; d++) {
      const key = `${s.id}_${d}`;
      if (!lockedSnapshot[key] && fixed.includes(dayOfWeek(ym, d))) {
        lockedSnapshot[key] = 'off';
      }
    }
  });
  // ★外部スタッフは自動生成の対象外。手入力のシフトをそのまま保持する
  state.staff.filter(isExternalStaff).forEach(s => {
    for (let d = 1; d <= days; d++) {
      const t = getShift(s.id, d);
      if (t) lockedSnapshot[`${s.id}_${d}`] = t;
    }
  });

  // ローディング表示
  showLoading('シフト生成中…', '試行回数: 0 / 最少違反: -');

  // ブラウザのUIスレッドを開放しながら試行
  // ★違反ゼロのパターンが出るまで粘る。出たら即採用。
  //   上限（回数 or 時間）に達したら、それまでの最少違反パターンを採用。
  //   スコアは違反パネル（detectViolations）と完全に同一基準。
  let bestShifts = null;
  let bestScore = Infinity; // 違反の総数
  let bestAttempt = 0;

  const MAX_ATTEMPTS = 3000;
  const TIME_LIMIT_MS = 20000; // 20秒で打ち切り
  const BATCH_SIZE = 8;        // バッチごとに UI 更新
  const startTime = Date.now();
  let attempt = 0;

  for (attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    // バッチ毎にUIに制御を返す
    if (attempt % BATCH_SIZE === 1) {
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(0);
      updateLoading('シフト生成中…（違反ゼロを探索）',
        `試行 ${attempt}回 / ${elapsed}秒  ●  最少違反: ${bestScore === Infinity ? '-' : bestScore}件（${bestAttempt}回目）`);
      await sleep(0);
    }

    // 試行開始：状態リセット → ロック書き戻し
    md.shifts = {};
    Object.keys(lockedSnapshot).forEach(k => { md.shifts[k] = lockedSnapshot[k]; });

    // 試行戦略を多様化（5パターン回す）
    const strategy = attempt % 5;
    runSingleGeneration(ym, days, md, strategy);

    // 違反パネルと同一基準でスコア化
    const score = detectViolations().length;

    if (score < bestScore) {
      bestScore = score;
      bestShifts = JSON.parse(JSON.stringify(md.shifts));
      bestAttempt = attempt;
    }

    // 違反ゼロ達成 → 即採用して終了
    if (bestScore === 0) break;
    // 時間切れ → 最少違反パターンを採用
    if (Date.now() - startTime > TIME_LIMIT_MS) break;
  }

  // ベスト結果を採用
  md.shifts = bestShifts;
  md.generated = true;
  saveState();
  hideLoading();
  renderAll();

  if (bestScore === 0) {
    showToast(`シフト生成完了：違反ゼロ達成！（${bestAttempt}回目の試行で発見）`);
  } else {
    const tried = Math.min(attempt, MAX_ATTEMPTS);
    showToast(`シフト生成完了：${tried}回試行しましたが違反ゼロは見つからず、最少の違反${bestScore}件のパターンを採用しました。内容は違反パネルで確認できます`, 6000);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showLoading(text, detail) {
  const el = document.getElementById('loading-overlay');
  document.getElementById('loading-text').textContent = text || '処理中…';
  document.getElementById('loading-detail').textContent = detail || '';
  el.classList.remove('hidden');
}
function updateLoading(text, detail) {
  document.getElementById('loading-text').textContent = text || '処理中…';
  document.getElementById('loading-detail').textContent = detail || '';
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}

/* 単一試行：第1〜4パスを順次実行（規定休数達成は絶対、人数不足は最小化）
 * strategy: 0-4 の試行戦略番号（スタッフの並び順を変えて多様な解を探索）
 */
function runSingleGeneration(ym, days, md, strategy) {
  // ★外部スタッフは生成・集計の対象外
  const targets = internalStaff();

  // ★月跨ぎ連勤の持ち越し（前月末・翌月頭）。生成中に前後月は変わらないので1回だけ計算
  const carry = {};
  targets.forEach(s => { carry[s.id] = getCarryStreaks(s.id, ym); });
  const carryIn = (id) => (carry[id] ? carry[id].carryIn : 0);
  const carryOut = (id) => (carry[id] ? carry[id].carryOut : 0);

  // ★月を跨ぐ週の、前月・翌月側の休日数（週休判定用）
  const weekCarry = {};
  targets.forEach(s => { weekCarry[s.id] = getWeekCarryHolidays(s.id, ym); });

  // ★時間帯ごとの最低人数条件
  const coverRules = activeCoverageRules();

  // 固定休曜日の判定（この 'off' は移動・スワップしてはいけない）
  const fixedOffMap = {};
  targets.forEach(st => {
    if (Array.isArray(st.fixedOffDays) && st.fixedOffDays.length > 0) {
      fixedOffMap[st.id] = new Set(st.fixedOffDays);
    }
  });
  function isFixedOffDay(staffId, day) {
    const set = fixedOffMap[staffId];
    return !!(set && set.has(dayOfWeek(ym, day)));
  }

  // ヘルパー：生成中の暫定出勤判定（未設定=出勤予定）
  function isOnSiteGen(staffId, day) {
    const t = md.shifts[`${staffId}_${day}`];
    if (!t) return true; // 未設定 = 出勤予定（生成中の暫定）
    const def = SHIFT_TYPES[t];
    return !!(def && def.countAsWork);
  }

  // ある日の現場人数（生成中）
  function countOnSiteGen(day, excludeStaffId) {
    let count = 0;
    targets.forEach(s => {
      if (s.id === excludeStaffId) return;
      if (isOnSiteGen(s.id, day)) count++;
    });
    return count;
  }

  function countEmployeesOnSiteGen(day, excludeStaffId) {
    let count = 0;
    targets.forEach(s => {
      if (s.id === excludeStaffId) return;
      if (s.category === '社員' && isOnSiteGen(s.id, day)) count++;
    });
    return count;
  }

  // ある日・ある時刻に現場に居る人数（生成中）
  function countCoverGen(day, t, excludeStaffId) {
    let count = 0;
    targets.forEach(s => {
      if (s.id === excludeStaffId) return;
      if (isOnSiteGen(s.id, day) && isStaffPresentAt(s, t)) count++;
    });
    return count;
  }

  // 各対象スタッフについて: 必要な追加休数を計算
  const needOffMap = {};
  targets.forEach(s => {
    let lockedHolidays = 0;
    for (let d = 1; d <= days; d++) {
      const t = md.shifts[`${s.id}_${d}`];
      const def = SHIFT_TYPES[t];
      if (def && def.countAsHoliday) lockedHolidays++;
    }
    needOffMap[s.id] = Math.max(0, s.holidayBase - lockedHolidays);
  });

  // 共通：休み配置不可の理由（ロック・休系・研修・グループ被り）
  function canPlaceOffLoose(staffId, day) {
    const cur = md.shifts[`${staffId}_${day}`];
    if (cur) {
      const def = SHIFT_TYPES[cur];
      if (def && def.countAsHoliday) return false;
      if (def && def.locked) return false;
      if (cur === 'training') return false;
    }
    const staff = state.staff.find(s => s.id === staffId);
    if (staff.groupId != null) {
      const groupMates = targets.filter(s => s.groupId === staff.groupId && s.id !== staffId);
      for (const gm of groupMates) {
        const t = md.shifts[`${gm.id}_${day}`];
        const def = SHIFT_TYPES[t];
        if (def && def.countAsHoliday) return false;
      }
    }
    return true;
  }

  // strict: looseに加えて人数制約・社員制約をハードに守る
  function canPlaceOffStrict(staffId, day) {
    if (!canPlaceOffLoose(staffId, day)) return false;
    // 全体人数制約: 休ませた後の現場人数 >= 必要人数
    const req = md.requiredStaff[day - 1] || 0;
    const onSiteWithout = countOnSiteGen(day, staffId);
    if (onSiteWithout < req) return false;
    // 社員人数制約: 休ませる対象が社員なら、休ませた後の社員出勤数 >= 社員必要人数
    const staff = state.staff.find(s => s.id === staffId);
    if (staff.category === '社員') {
      const reqEmp = state.minEmployees || 0;
      const empWithout = countEmployeesOnSiteGen(day, staffId);
      if (empWithout < reqEmp) return false;
    }
    // ★時間帯カバレッジ：この人が居なくなると割り込む時間帯があるならNG
    for (const rule of coverRules) {
      if (!isStaffPresentAt(staff, rule.t)) continue; // 影響しない人はスキップ
      if (countCoverGen(day, rule.t, staffId) < rule.min) return false;
    }
    return true;
  }

  // ★前月末・翌月頭からの連続もカウントする
  function getConsecutiveAround(staffId, day) {
    let before = 0;
    let d = day - 1;
    for (; d >= 1; d--) {
      if (isWorkDayInShifts(staffId, d, md.shifts)) before++;
      else break;
    }
    if (d === 0) before += carryIn(staffId); // 1日まで連続 → 前月から継続
    let after = 0;
    let d2 = day + 1;
    for (; d2 <= days; d2++) {
      if (isWorkDayInShifts(staffId, d2, md.shifts)) after++;
      else break;
    }
    if (d2 === days + 1) after += carryOut(staffId); // 末日まで連続 → 翌月へ継続
    return { before, after, total: before + 1 + after };
  }

  /* ★月跨ぎ4連勤の予防：
   * 前月末から3連勤以上なら「当月1日」を、翌月頭が3連勤以上なら「当月末日」を
   * 先に休みとして確保しておく（後続パスはこの休みを動かすと連勤が悪化するので維持される） */
  const crossMonthLock = new Set(); // ここで置いた休みは後続パスで動かさない
  targets.forEach(s => {
    const preOff = (day, carried) => {
      if (carried < 3) return;
      if (needOffMap[s.id] <= 0) return;
      // ★人数・社員数・時間帯の条件を満たすときだけ先押さえ（該当者が多い日に全員休ませない）
      if (!canPlaceOffStrict(s.id, day)) return;
      md.shifts[`${s.id}_${day}`] = 'off';
      crossMonthLock.add(`${s.id}_${day}`);
      needOffMap[s.id]--;
    };
    preOff(1, carryIn(s.id));
    preOff(days, carryOut(s.id));
  });
  function isLockedOff(staffId, day) {
    return isFixedOffDay(staffId, day) || crossMonthLock.has(`${staffId}_${day}`);
  }

  // 試行戦略によってスタッフ並び順を変える（局所最適解から脱出）
  let sortedTargets;
  switch (strategy) {
    case 0:
      // 残り休数多い順 + 同点ランダム
      sortedTargets = [...targets].sort((a, b) =>
        (needOffMap[b.id] - needOffMap[a.id]) || (Math.random() - 0.5));
      break;
    case 1:
      // 残り休数少ない順 + 同点ランダム
      sortedTargets = [...targets].sort((a, b) =>
        (needOffMap[a.id] - needOffMap[b.id]) || (Math.random() - 0.5));
      break;
    case 2:
      // 完全ランダム
      sortedTargets = [...targets].sort(() => Math.random() - 0.5);
      break;
    case 3:
      // グループ所属者を先に（制約厳しい人優先）
      sortedTargets = [...targets].sort((a, b) => {
        const ag = a.groupId != null ? 0 : 1;
        const bg = b.groupId != null ? 0 : 1;
        return (ag - bg) || (needOffMap[b.id] - needOffMap[a.id]) || (Math.random() - 0.5);
      });
      break;
    case 4:
      // 社員を先に（社員必要人数の制約厳しい）
      sortedTargets = [...targets].sort((a, b) => {
        const ae = a.category === '社員' ? 0 : 1;
        const be = b.category === '社員' ? 0 : 1;
        return (ae - be) || (needOffMap[b.id] - needOffMap[a.id]) || (Math.random() - 0.5);
      });
      break;
    default:
      sortedTargets = [...targets].sort(() => Math.random() - 0.5);
  }

  /* ===== 第一パス: strict（人数・社員制約を守って配置） ===== */
  for (const s of sortedTargets) {
    let remaining = needOffMap[s.id];
    if (remaining <= 0) continue;

    while (remaining > 0) {
      const candidates = [];
      for (let d = 1; d <= days; d++) {
        if (!canPlaceOffStrict(s.id, d)) continue;

        let score = 0;
        // 人数余裕度（プラスが大きい日を優先）
        const req = md.requiredStaff[d - 1] || 0;
        const onSite = countOnSiteGen(d, s.id);
        const slack = onSite - req;
        score += slack * 5;

        // 4連勤回避
        const consec = getConsecutiveAround(s.id, d);
        if (consec.total >= 4) score += 1000;
        else if (consec.total === 3) score += 10;

        // 週の規定休数に届いてない週なら強くプラス
        const weekHolidays = countWeekHolidays(s.id, d, days, ym, md.shifts, weekCarry[s.id]);
        const minWeekOff = (typeof s.weeklyOff === 'number') ? s.weeklyOff : 2;
        if (minWeekOff > 0 && weekHolidays < minWeekOff) score += 30;

        // 試行ごとのばらつき用（強めの乱数）
        score += Math.random() * 3;
        candidates.push({ day: d, score });
      }
      if (candidates.length === 0) break;
      candidates.sort((a, b) => b.score - a.score);
      md.shifts[`${s.id}_${candidates[0].day}`] = 'off';
      remaining--;
    }
  }

  /* ===== 第二パス: loose（人数余裕を優先しつつ規定休数達成） ===== */
  for (const s of sortedTargets) {
    while (true) {
      let placedHolidays = 0;
      for (let d = 1; d <= days; d++) {
        const t = md.shifts[`${s.id}_${d}`];
        const def = SHIFT_TYPES[t];
        if (def && def.countAsHoliday) placedHolidays++;
      }
      if (placedHolidays >= s.holidayBase) break;

      const candidates = [];
      for (let d = 1; d <= days; d++) {
        if (!canPlaceOffLoose(s.id, d)) continue;
        // 人数余裕度
        const req = md.requiredStaff[d - 1] || 0;
        const onSiteWithout = countOnSiteGen(d, s.id);
        const slack = onSiteWithout - req;
        // 社員余裕度
        let empSlack = 999;
        if (s.category === '社員') {
          const reqEmp = state.minEmployees || 0;
          const empWithout = countEmployeesOnSiteGen(d, s.id);
          empSlack = empWithout - reqEmp;
        }
        // ★時間帯カバレッジの余裕度（この人が抜けたときに割り込まないか）
        let coverSlack = 999;
        for (const rule of coverRules) {
          if (!isStaffPresentAt(s, rule.t)) continue;
          coverSlack = Math.min(coverSlack, countCoverGen(d, rule.t, s.id) - rule.min);
        }
        const consec = getConsecutiveAround(s.id, d);
        candidates.push({ d, slack, empSlack, coverSlack, total: consec.total });
      }
      if (candidates.length === 0) break;
      // 1. 余裕（人数・社員・時間帯）がすべてプラス＝不足を作らない日を優先
      // 2. 余裕の最小値が大きい方優先
      // 3. 連勤が長いところ優先
      candidates.sort((a, b) => {
        const aMin = Math.min(a.slack, a.empSlack, a.coverSlack);
        const bMin = Math.min(b.slack, b.empSlack, b.coverSlack);
        // 両者ともプラスなら、連勤長 + 余裕 + 乱数で比較
        if (aMin >= 0 && bMin >= 0) {
          const aScore = a.total * 2 + aMin + Math.random() * 2;
          const bScore = b.total * 2 + bMin + Math.random() * 2;
          return bScore - aScore;
        }
        // プラス/マイナスの違いで優先
        return bMin - aMin;
      });
      md.shifts[`${s.id}_${candidates[0].d}`] = 'off';
    }

    // ★強制パス: それでも規定休数に届かない場合、グループ被りを許容してでも配置する
    // （出勤数=規定ぴったりを絶対優先。被りは違反パネルに表示される）
    let forcedCount = 0;
    for (let d = 1; d <= days; d++) {
      const t = md.shifts[`${s.id}_${d}`];
      const def = SHIFT_TYPES[t];
      if (def && def.countAsHoliday) forcedCount++;
    }
    while (forcedCount < s.holidayBase) {
      let placedDay = -1;
      let bestSlack = -Infinity;
      for (let d = 1; d <= days; d++) {
        const cur = md.shifts[`${s.id}_${d}`];
        if (cur) {
          const def = SHIFT_TYPES[cur];
          if (def && (def.countAsHoliday || def.locked)) continue;
          if (cur === 'training') continue;
        }
        // 人数余裕が最も大きい日を選ぶ（被害最小化）
        const slack = countOnSiteGen(d, s.id) - (md.requiredStaff[d - 1] || 0);
        if (slack > bestSlack) { bestSlack = slack; placedDay = d; }
      }
      if (placedDay === -1) break; // 希望休・研修等で全日埋まっており物理的に不可能
      md.shifts[`${s.id}_${placedDay}`] = 'off';
      forcedCount++;
    }
  }

  /* ===== 第三パス: 4連勤修復（★月跨ぎ分も含めて数える） ===== */
  // 戻り値: [{ days: [当月の日], len: 月跨ぎを含む実連勤日数 }]
  function findStreaks(staffId) {
    const streaks = [];
    let current = null;
    for (let d = 1; d <= days + 1; d++) {
      const isWork = d <= days && isWorkDayInShifts(staffId, d, md.shifts);
      if (isWork) {
        if (!current) current = { days: [], len: 0 };
        current.days.push(d);
        current.len++;
      } else if (current) {
        if (current.days[0] === 1) current.len += carryIn(staffId);
        if (current.days[current.days.length - 1] === days) current.len += carryOut(staffId);
        streaks.push(current);
        current = null;
      }
    }
    return streaks;
  }

  // 長い連勤（4日以上）の総日数。減れば改善とみなす
  function countLongStreakDays(staffId) {
    return findStreaks(staffId)
      .filter(st => st.len >= 4)
      .reduce((sum, st) => sum + st.len, 0);
  }

  // ★休数を増やさないため、「追加」ではなく既配置の 'off' を「移動」して解消する
  for (const s of targets) {
    let iter = 0;
    while (iter < 100) {
      const streaks = findStreaks(s.id);
      const longStreaks = streaks.filter(st => st.len >= 4);
      if (longStreaks.length === 0) break;
      longStreaks.sort((a, b) => b.len - a.len);
      const targetStreak = longStreaks[0].days;
      const center = Math.floor(targetStreak.length / 2);
      const tryOrder = [targetStreak[center]];
      for (let off = 1; off < targetStreak.length; off++) {
        const left = center - off;
        const right = center + off;
        if (left >= 0) tryOrder.push(targetStreak[left]);
        if (right < targetStreak.length) tryOrder.push(targetStreak[right]);
      }

      // 移動元候補: 自動配置された 'off'（希望休などロック休・固定休曜日は動かせない）
      const donorDays = [];
      for (let d2 = 1; d2 <= days; d2++) {
        if (md.shifts[`${s.id}_${d2}`] === 'off' && !isLockedOff(s.id, d2)) donorDays.push(d2);
      }

      const before = countLongStreakDays(s.id);
      let moved = false;
      outerMove: for (const d of tryOrder) {
        if (!canPlaceOffLoose(s.id, d)) continue;
        for (const d2 of donorDays) {
          if (d2 === d) continue;
          // 仮移動: d2 の off を d へ（d2 は未設定=出勤予定に戻す）
          delete md.shifts[`${s.id}_${d2}`];
          md.shifts[`${s.id}_${d}`] = 'off';
          if (countLongStreakDays(s.id) < before) { moved = true; break outerMove; }
          // 改善しなければ戻す
          delete md.shifts[`${s.id}_${d}`];
          md.shifts[`${s.id}_${d2}`] = 'off';
        }
      }
      if (!moved) break; // 移動では解消不能（休数厳守を優先し、連勤は許容）
      iter++;
    }
  }

  // 残り未設定セルを 'work' に確定（★外部スタッフは触らない）
  targets.forEach(s => {
    for (let d = 1; d <= days; d++) {
      const key = `${s.id}_${d}`;
      if (!md.shifts[key]) md.shifts[key] = 'work';
    }
  });

  /* ===== 第四パス: 人数不足修復スワップ（強化版） ===== */
  // 確定後の現場判定
  function isOnSiteAfter(staffId, day) {
    const t = md.shifts[`${staffId}_${day}`];
    if (!t) return false;
    const def = SHIFT_TYPES[t];
    return !!(def && def.countAsWork);
  }

  function countOnSiteAfter(day, excludeId) {
    let n = 0;
    targets.forEach(s => {
      if (s.id === excludeId) return;
      if (isOnSiteAfter(s.id, day)) n++;
    });
    return n;
  }

  function countEmpOnSiteAfter(day, excludeId) {
    let n = 0;
    targets.forEach(s => {
      if (s.id === excludeId) return;
      if (s.category === '社員' && isOnSiteAfter(s.id, day)) n++;
    });
    return n;
  }

  // ある日・ある時刻に現場に居る人数（確定後）
  function countCoverAfter(day, t, excludeId) {
    let n = 0;
    targets.forEach(s => {
      if (s.id === excludeId) return;
      if (isOnSiteAfter(s.id, day) && isStaffPresentAt(s, t)) n++;
    });
    return n;
  }

  function findUnderstaffed() {
    for (let d = 1; d <= days; d++) {
      const req = md.requiredStaff[d - 1] || 0;
      if (req > 0) {
        const onSite = countOnSiteAfter(d, -1);
        if (onSite < req) return { day: d, type: 'total', shortage: req - onSite };
      }
      const reqEmp = state.minEmployees || 0;
      if (reqEmp > 0) {
        const onSiteEmp = countEmpOnSiteAfter(d, -1);
        if (onSiteEmp < reqEmp) return { day: d, type: 'employee', shortage: reqEmp - onSiteEmp };
      }
      // ★時間帯カバレッジ不足（6:30に3人、8:00に5人 など）
      for (const rule of coverRules) {
        const cnt = countCoverAfter(d, rule.t, -1);
        if (cnt < rule.min) {
          return { day: d, type: 'coverage', t: rule.t, shortage: rule.min - cnt };
        }
      }
    }
    return null;
  }

  // ★月跨ぎ分も含めて4連勤になっていないか
  function createsConsecutive4(staffId) {
    let streak = 0;
    for (let d = 1; d <= days; d++) {
      if (isOnSiteAfter(staffId, d)) {
        streak = (d === 1) ? carryIn(staffId) + 1 : streak + 1;
        if (streak >= 4) return true;
      } else streak = 0;
    }
    // 末日まで連続してるなら翌月分を足す
    if (streak > 0 && streak + carryOut(staffId) >= 4) return true;
    return false;
  }

  // 4連勤修復（第四パス後の後追い）
  function repairConsecutive4() {
    for (const s of targets) {
      let iter = 0;
      while (iter < 50) {
        // 連勤を見つける
        let streakStart = -1;
        let longestStreak = null;
        let longestLen = 0;
        let curStart = -1, curLen = 0, curDayLen = 0, longestDayLen = 0;
        for (let d = 1; d <= days + 1; d++) {
          const isWork = d <= days && isOnSiteAfter(s.id, d);
          if (isWork) {
            if (curDayLen === 0) { curStart = d; curLen = (d === 1) ? carryIn(s.id) : 0; }
            curLen++;
            curDayLen++;
          } else {
            // 末日まで続いてたら翌月分も足す（当月内の日数はそのまま）
            const totalLen = curLen + ((curDayLen > 0 && d - 1 === days) ? carryOut(s.id) : 0);
            if (curDayLen > 0 && totalLen > longestLen) {
              longestLen = totalLen;
              longestDayLen = curDayLen;
              streakStart = curStart;
            }
            curLen = 0;
            curDayLen = 0;
          }
        }
        if (longestLen < 4) break;

        // 中央付近を休みに変える（当月内の日だけが操作対象）
        const center = streakStart + Math.floor(longestDayLen / 2);
        const tryDays = [center];
        for (let off = 1; off < longestDayLen; off++) {
          if (center - off >= streakStart) tryDays.push(center - off);
          if (center + off < streakStart + longestDayLen) tryDays.push(center + off);
        }
        // ★中央付近を休みに変え、代わりに既存の 'off' を1日出勤へ戻す（休数不変スワップ）
        function longStreakDaysAfter(staffId) {
          let total = 0, streak = 0, dayLen = 0;
          for (let dd = 1; dd <= days + 1; dd++) {
            const w = dd <= days && isOnSiteAfter(staffId, dd);
            if (w) {
              if (dayLen === 0) streak = (dd === 1) ? carryIn(staffId) : 0;
              streak++;
              dayLen++;
            } else {
              if (dayLen > 0) {
                const len = streak + ((dd - 1 === days) ? carryOut(staffId) : 0);
                if (len >= 4) total += len;
              }
              streak = 0;
              dayLen = 0;
            }
          }
          return total;
        }
        const beforeTotal = longStreakDaysAfter(s.id);
        let placed = false;
        outerRepair: for (const d of tryDays) {
          const cur = md.shifts[`${s.id}_${d}`];
          if (cur !== 'work') continue; // 触れるのは確定出勤のみ
          // グループ被りチェック
          if (s.groupId != null) {
            const overlap = targets.some(other => {
              if (other.id === s.id || other.groupId !== s.groupId) return false;
              const t = md.shifts[`${other.id}_${d}`];
              const def = SHIFT_TYPES[t];
              return def && def.countAsHoliday;
            });
            if (overlap) continue;
          }
          // 移動元: 自動配置の 'off' を探してスワップ（固定休曜日は除外）
          for (let d2 = 1; d2 <= days; d2++) {
            if (d2 === d) continue;
            if (md.shifts[`${s.id}_${d2}`] !== 'off') continue;
            if (isLockedOff(s.id, d2)) continue;
            md.shifts[`${s.id}_${d}`] = 'off';
            md.shifts[`${s.id}_${d2}`] = 'work';
            if (longStreakDaysAfter(s.id) < beforeTotal) {
              placed = true;
              break outerRepair;
            }
            // 改善しなければ戻す
            md.shifts[`${s.id}_${d}`] = 'work';
            md.shifts[`${s.id}_${d2}`] = 'off';
          }
        }
        if (!placed) break;
        iter++;
      }
    }
  }

  let swapRound = 0;
  const MAX_ROUNDS = 5;
  while (swapRound < MAX_ROUNDS) {
    let totalSwaps = 0;
    let swapIter = 0;
    const MAX_SWAP = 2000;

    while (swapIter < MAX_SWAP) {
      const issue = findUnderstaffed();
      if (!issue) break;
      const { day, type } = issue;

      // その日 'off' のスタッフ（固定休曜日の人は出勤に変えられないので除外）
      const candidates = targets.filter(s => {
        if (md.shifts[`${s.id}_${day}`] !== 'off') return false;
        if (isLockedOff(s.id, day)) return false;
        if (type === 'employee' && s.category !== '社員') return false;
        // ★時間帯不足の修復は、その時刻に居る人でないと意味がない
        if (type === 'coverage' && !isStaffPresentAt(s, issue.t)) return false;
        return true;
      });
      if (candidates.length === 0) break;

      // 軽くランダム化
      candidates.sort(() => Math.random() - 0.5);

      let swapped = false;
      outer: for (const s of candidates) {
        // スワップ先 d2 の候補を構築（s が work の日）
        const d2Candidates = [];
        for (let d2 = 1; d2 <= days; d2++) {
          if (d2 === day) continue;
          if (md.shifts[`${s.id}_${d2}`] !== 'work') continue;

          // d2 で s を休ませた場合の余裕度を計算
          const req2 = md.requiredStaff[d2 - 1] || 0;
          const onSite2 = countOnSiteAfter(d2, s.id);
          const slack2 = onSite2 - req2;
          if (slack2 < 0) continue;

          // 社員制約
          if (s.category === '社員') {
            const reqEmp2 = state.minEmployees || 0;
            if (reqEmp2 > 0) {
              const onSiteEmp2 = countEmpOnSiteAfter(d2, s.id);
              if (onSiteEmp2 < reqEmp2) continue;
            }
          }

          // ★時間帯カバレッジ：d2 を休みにして別の時間帯が割れたら意味がない
          let coverBroken = false;
          for (const rule of coverRules) {
            if (!isStaffPresentAt(s, rule.t)) continue;
            if (countCoverAfter(d2, rule.t, s.id) < rule.min) { coverBroken = true; break; }
          }
          if (coverBroken) continue;

          // グループ被り
          if (s.groupId != null) {
            const overlap = targets.some(other => {
              if (other.id === s.id || other.groupId !== s.groupId) return false;
              const t = md.shifts[`${other.id}_${d2}`];
              const def = SHIFT_TYPES[t];
              return def && def.countAsHoliday;
            });
            if (overlap) continue;
          }

          d2Candidates.push({ d2, slack: slack2 });
        }

        // 余裕の多い日を優先
        d2Candidates.sort((a, b) => b.slack - a.slack || (Math.random() - 0.5));

        for (const { d2 } of d2Candidates) {
          // スワップ仮実行 → 4連勤チェック
          const oldA = md.shifts[`${s.id}_${day}`];
          const oldB = md.shifts[`${s.id}_${d2}`];
          md.shifts[`${s.id}_${day}`] = 'work';
          md.shifts[`${s.id}_${d2}`] = 'off';
          if (createsConsecutive4(s.id)) {
            md.shifts[`${s.id}_${day}`] = oldA;
            md.shifts[`${s.id}_${d2}`] = oldB;
            continue;
          }
          swapped = true;
          break outer;
        }
      }
      if (!swapped) break;
      swapIter++;
      totalSwaps++;
    }

    if (totalSwaps === 0) break; // 何も改善できなかったので終了

    // スワップで4連勤になった可能性 → 修復
    repairConsecutive4();
    swapRound++;
  }

  // 最終 4連勤修復（規定休数を下回らせない範囲で）
  repairConsecutive4();

  /* ===== 第五パス: 週休修復（★月を跨ぐ週も含む・休数不変スワップ） =====
   * 週の休みが足りない週があれば、休みに余裕がある別の週の「休」を1日持ってくる。
   * 移した先の日は人数・社員数・時間帯・グループの条件をすべて満たす日だけ。
   * 連勤が悪化するスワップは採用しない。 */
  function weekInfoGen(staffId, day) {
    const sun = day - dayOfWeek(ym, day);
    let h = 0;
    for (let o = 0; o < 7; o++) {
      const dd = sun + o;
      if (dd < 1 || dd > days) continue;
      const def = SHIFT_TYPES[md.shifts[`${staffId}_${dd}`]];
      if (def && def.countAsHoliday) h++;
    }
    const wc = weekCarry[staffId];
    let known = true;
    if (sun < 1) { if (wc && wc.head != null) h += wc.head; else known = false; }
    if (sun + 6 > days) { if (wc && wc.tail != null) h += wc.tail; else known = false; }
    return { sun, holidays: h, known };
  }
  function repairWeeklyOff() {
    for (const s of targets) {
      const minW = (typeof s.weeklyOff === 'number') ? s.weeklyOff : 2;
      if (minW <= 0) continue;
      for (let guard = 0; guard < 20; guard++) {
        // 不足している週を探す（判定できない週＝隣月データ無しの端数週は対象外）
        let short = null;
        for (let sun = 1 - dayOfWeek(ym, 1); sun <= days; sun += 7) {
          const wi = weekInfoGen(s.id, Math.max(1, sun));
          if (wi.known && wi.holidays < minW) { short = wi; break; }
        }
        if (!short) break;

        // 移し先：不足週の中の「出勤」日で、休ませても条件を壊さない日
        const toDays = [];
        for (let o = 0; o < 7; o++) {
          const d = short.sun + o;
          if (d < 1 || d > days) continue;
          if (md.shifts[`${s.id}_${d}`] !== 'work') continue;
          if (!canPlaceOffStrict(s.id, d)) continue;
          toDays.push(d);
        }
        // 移し元：別の週にある通常の「休」で、抜いてもその週が規定を割らない日
        const fromDays = [];
        for (let d2 = 1; d2 <= days; d2++) {
          if (md.shifts[`${s.id}_${d2}`] !== 'off') continue;
          if (isLockedOff(s.id, d2)) continue;
          const wi2 = weekInfoGen(s.id, d2);
          if (wi2.sun === short.sun) continue;
          if (wi2.holidays - 1 < minW) continue;
          fromDays.push(d2);
        }
        if (toDays.length === 0 || fromDays.length === 0) break;
        toDays.sort(() => Math.random() - 0.5);
        fromDays.sort(() => Math.random() - 0.5);

        const before = countLongStreakDays(s.id);
        let done = false;
        outer:
        for (const d of toDays) {
          for (const d2 of fromDays) {
            md.shifts[`${s.id}_${d}`] = 'off';
            md.shifts[`${s.id}_${d2}`] = 'work';
            if (countLongStreakDays(s.id) > before) {
              md.shifts[`${s.id}_${d}`] = 'work';
              md.shifts[`${s.id}_${d2}`] = 'off';
              continue;
            }
            done = true;
            break outer;
          }
        }
        if (!done) break;
      }
    }
  }
  repairWeeklyOff();

  // 注: 規定休数達成が絶対優先のため、強制 off→work 変換は行わない。
  // 残った人数不足は違反パネルで表示される。
}

function isWorkDayInShifts(staffId, day, shifts) {
  const t = shifts[`${staffId}_${day}`];
  const def = SHIFT_TYPES[t || 'work'];
  if (!t) return true; // 未設定は仮想的に出勤
  return def && def.countAsWork;
}

function countWeekHolidays(staffId, refDay, days, ym, shifts, weekCarry) {
  // refDayを含む週（日〜土）の休数
  // ★weekCarry（getWeekCarryHolidays の結果）があれば、月を跨ぐ週は前月・翌月側の休みも足す
  const dow = dayOfWeek(ym, refDay);
  const sundayDay = refDay - dow;
  let count = 0;
  for (let off = 0; off < 7; off++) {
    const d = sundayDay + off;
    if (d < 1 || d > days) continue;
    const t = shifts[`${staffId}_${d}`];
    const def = SHIFT_TYPES[t];
    if (def && def.countAsHoliday) count++;
  }
  if (weekCarry) {
    if (sundayDay < 1 && weekCarry.head != null) count += weekCarry.head;
    if (sundayDay + 6 > days && weekCarry.tail != null) count += weekCarry.tail;
  }
  return count;
}
