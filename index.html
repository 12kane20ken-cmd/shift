<script>
/* ===== Excelテンプレート保存（IndexedDB） ===== */
// localStorage では容量制限（5-10MB）に当たりやすいので IndexedDB を使用
async function getStoredTemplate() {
  try {
    const db = await openHandleDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(HANDLE_STORE, 'readonly');
      const req = tx.objectStore(HANDLE_STORE).get('excelTemplate');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    console.error('テンプレ取得失敗:', e);
    return null;
  }
}

async function storeTemplate(base64) {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(HANDLE_STORE, 'readwrite');
    tx.objectStore(HANDLE_STORE).put(base64, 'excelTemplate');
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

async function clearStoredTemplate() {
  try {
    const db = await openHandleDB();
    await new Promise((resolve) => {
      const tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).delete('excelTemplate');
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch (e) { console.error(e); }
}

// 旧データ：localStorage に残ってる場合は IndexedDB に移行
async function migrateTemplateIfNeeded() {
  try {
    const old = localStorage.getItem(STORAGE_TEMPLATE_KEY);
    if (old) {
      const existing = await getStoredTemplate();
      if (!existing) {
        await storeTemplate(old);
        console.log('テンプレを IndexedDB に移行しました');
      }
      localStorage.removeItem(STORAGE_TEMPLATE_KEY);
    }
  } catch (e) { console.error('テンプレ移行失敗:', e); }
}

async function exportToExcel() {
  try {
    await ensureJSZip();
  } catch (e) {
    showToast(e.message);
    return;
  }

  const tplBase64 = await getStoredTemplate();
  if (!tplBase64) {
    openTemplateUploadModal();
    return;
  }

  generateExcelFromTemplate(tplBase64);
}

function openTemplateUploadModal() {
  showModal(`
    <div class="modal-title">Excelテンプレートを登録</div>
    <div style="margin-bottom:16px;font-size:13px;color:#374151;line-height:1.6;">
      初回のみ、課長に提出する形式のExcelファイル（雛形）をアップロードしてください。<br>
      テンプレートはブラウザに保存され、次回以降は自動で使われます。
    </div>
    <div class="form-row">
      <input type="file" id="tpl-file" accept=".xlsx" class="form-input">
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="modal-actions-right">
        <button class="btn btn-secondary" id="tpl-cancel">キャンセル</button>
        <button class="btn btn-primary" id="tpl-save">登録</button>
      </div>
    </div>
  `);
  document.getElementById('tpl-cancel').addEventListener('click', closeModal);
  document.getElementById('tpl-save').addEventListener('click', () => {
    const file = document.getElementById('tpl-file').files[0];
    if (!file) { showToast('ファイルを選択してください'); return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const base64 = e.target.result.split(',')[1];
        await storeTemplate(base64);
        closeModal();
        showToast('テンプレートを保存しました');
        generateExcelFromTemplate(base64);
      } catch (err) {
        console.error(err);
        showToast('テンプレ保存失敗: ' + err.message);
      }
    };
    reader.readAsDataURL(file);
  });
}

/* ===== Excel出力（XML直接編集方式・テンプレ完全保持） =====
 * テンプレxlsxをZIPとして開き、セルの「値」だけをXMLレベルで書き換える。
 * スタイル・罫線・列幅・行高・結合セル・印刷設定には一切触れないため、
 * 出力はテンプレと完全に同じ見た目になる。
 * 赤字（希望休）とグループ色のみ、styles.xml に「元スタイルの複製＋色差し替え」を
 * 追加して適用する（元スタイルの罫線等はそのまま引き継がれる）。 */
let jszipLoading = null;
function ensureJSZip() {
  if (window.JSZip) return Promise.resolve();
  if (jszipLoading) return jszipLoading;
  jszipLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    script.onload = () => resolve();
    script.onerror = () => {
      jszipLoading = null;
      reject(new Error('JSZipの読み込みに失敗しました（ネットワーク接続を確認してください）'));
    };
    document.head.appendChild(script);
  });
  return jszipLoading;
}

/* --- 純粋関数群（XML文字列操作） --- */
function xlsxColLetter(c0) {
  let s = '', n = c0;
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}
function xlsxColIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function xlsxRefParts(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  return { col: xlsxColIndex(m[1]), row: parseInt(m[2]) };
}
function xlsxEscape(v) {
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// workbook.xml と rels から最初のシートのパスを解決
function xlsxResolveSheetPath(workbookXml, relsXml) {
  let target = 'worksheets/sheet1.xml';
  const sheetM = workbookXml.match(/<sheet\b[^>]*?\/>/) || workbookXml.match(/<sheet\b[^>]*?>/);
  const ridM = sheetM && sheetM[0].match(/r:id="([^"]+)"/);
  if (ridM) {
    const relRe = new RegExp('<Relationship\\b[^>]*Id="' + ridM[1] + '"[^>]*?/>');
    const relM = relsXml.match(relRe);
    const tM = relM && relM[0].match(/Target="([^"]+)"/);
    if (tM) target = tM[1];
  }
  target = target.replace(/^\//, '');
  return target.startsWith('xl/') ? target : 'xl/' + target;
}

// styles.xml エディタ: 元スタイルを複製して色だけ差し替えたバリアントを追加する
function createXlsxStyleEditor(stylesXml) {
  let xml = stylesXml;
  const variantCache = {};

  function section(tag) {
    const re = new RegExp('(<' + tag + '\\b[^>]*>)([\\s\\S]*?)(</' + tag + '>)');
    const m = xml.match(re);
    return m ? { full: m[0], open: m[1], inner: m[2], close: m[3] } : null;
  }
  function elems(inner, childTag) {
    const re = new RegExp('<' + childTag + '\\b[^>]*/>|<' + childTag + '\\b[^>]*>[\\s\\S]*?</' + childTag + '>', 'g');
    return inner.match(re) || [];
  }
  function appendChild(sectionTag, childTag, childXml) {
    const sec = section(sectionTag);
    if (!sec) throw new Error('styles.xml に <' + sectionTag + '> がありません');
    const list = elems(sec.inner, childTag);
    let open = sec.open;
    if (/count="\d+"/.test(open)) open = open.replace(/count="\d+"/, 'count="' + (list.length + 1) + '"');
    xml = xml.replace(sec.full, () => open + sec.inner + childXml + sec.close);
    return list.length; // 新要素のインデックス
  }
  function getElem(sectionTag, childTag, idx) {
    const sec = section(sectionTag);
    if (!sec) return null;
    return elems(sec.inner, childTag)[idx] || null;
  }
  function ensureXfAttr(xf, name, val) {
    const re = new RegExp(name + '="[^"]*"');
    if (re.test(xf)) return xf.replace(re, name + '="' + val + '"');
    return xf.replace(/<xf\b/, '<xf ' + name + '="' + val + '"');
  }

  function fontVariant(fontId, rgb) {
    let font = getElem('fonts', 'font', fontId) || '<font/>';
    if (/\/>$/.test(font)) font = font.replace(/\/>$/, '></font>');
    font = font.replace(/<color\b[^>]*\/>/g, '');
    font = font.replace(/(<font\b[^>]*>)/, '$1<color rgb="' + rgb + '"/>');
    return appendChild('fonts', 'font', font);
  }
  function fillVariant(rgb) {
    return appendChild('fills', 'fill',
      '<fill><patternFill patternType="solid"><fgColor rgb="' + rgb + '"/><bgColor indexed="64"/></patternFill></fill>');
  }

  // 元のスタイルidxを複製し、フォント色/塗りだけ差し替えた新スタイルidxを返す
  function variant(origIdx, fontRgb, fillRgb) {
    const key = origIdx + '|' + (fontRgb || '') + '|' + (fillRgb || '');
    if (variantCache[key] != null) return variantCache[key];
    let xf = getElem('cellXfs', 'xf', origIdx)
      || '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>';
    if (fontRgb) {
      const fm = xf.match(/fontId="(\d+)"/);
      const newFontId = fontVariant(fm ? parseInt(fm[1]) : 0, fontRgb);
      xf = fm ? xf.replace(/fontId="\d+"/, 'fontId="' + newFontId + '"')
              : xf.replace(/<xf\b/, '<xf fontId="' + newFontId + '"');
      xf = ensureXfAttr(xf, 'applyFont', '1');
    }
    if (fillRgb) {
      const newFillId = fillVariant(fillRgb);
      xf = /fillId="\d+"/.test(xf) ? xf.replace(/fillId="\d+"/, 'fillId="' + newFillId + '"')
                                   : xf.replace(/<xf\b/, '<xf fillId="' + newFillId + '"');
      xf = ensureXfAttr(xf, 'applyFill', '1');
    }
    const newIdx = appendChild('cellXfs', 'xf', xf);
    variantCache[key] = newIdx;
    return newIdx;
  }

  // 前月の出力で付けた色（グループ色の塗り・赤字）を外した素のスタイルidxを返す
  const OUR_FILLS = new Set(Object.values(XLSX_GROUP_FILL));
  const cleanCache = {};
  function rgbIn(elem, tag) {
    if (!elem) return null;
    const m = elem.match(new RegExp('<' + tag + '\\b[^>]*\\brgb="([0-9A-Fa-f]{8})"'));
    return m ? m[1].toUpperCase() : null;
  }
  function clean(origIdx, opt) {
    const key = origIdx + '|' + (opt.fill ? 1 : 0) + (opt.font ? 1 : 0);
    if (cleanCache[key] != null) return cleanCache[key];
    let xf = getElem('cellXfs', 'xf', origIdx);
    if (!xf) return (cleanCache[key] = origIdx);
    let changed = false;
    if (opt.fill) {
      const fm = xf.match(/fillId="(\d+)"/);
      if (fm && OUR_FILLS.has(rgbIn(getElem('fills', 'fill', parseInt(fm[1])), 'fgColor'))) {
        xf = xf.replace(/fillId="\d+"/, 'fillId="0"');
        changed = true;
      }
    }
    if (opt.font) {
      const fm = xf.match(/fontId="(\d+)"/);
      const font = fm ? getElem('fonts', 'font', parseInt(fm[1])) : null;
      if (font && rgbIn(font, 'color') === XLSX_RED) {
        const plain = font.replace(/<color\b[^>]*\/>/g, '');
        const nid = appendChild('fonts', 'font', plain);
        xf = xf.replace(/fontId="\d+"/, 'fontId="' + nid + '"');
        changed = true;
      }
    }
    if (!changed) return (cleanCache[key] = origIdx);
    return (cleanCache[key] = appendChild('cellXfs', 'xf', xf));
  }

  return { variant, clean, output: () => xml };
}

/* ======================================================================
 * Excel テンプレの構造編集
 *  - スタッフ欄の自動検出（前月に出力したファイルをテンプレにしても正しく数える）
 *  - 人数の増減に合わせて行を挿入／削除（Excelで行を挿入・削除したのと同じ規則で
 *    数式・結合セル・条件付き書式・入力規則・印刷範囲・図形・コメントを追随させる）
 *  - 数式が入っているセルには書き込まない
 *  - 共有数式の展開、計算チェーンの削除、文字列は共有文字列で書き込む
 *    （Excelが自分で保存したときと同じ形にして、バージョン差で壊れにくくする）
 * ====================================================================== */

const XLSX_GROUP_FILL = { a: 'FFFFF7DC', b: 'FFE4F8EB', c: 'FFDBEAFE', d: 'FFEDE9FE' };
const XLSX_RED = 'FFFF0000';
const XLSX_DAY_COLS = 31;

function xlsxUnescape(s) {
  return String(s).replace(/&(#x[0-9a-fA-F]+|#\d+|lt|gt|quot|apos|amp);/g, (m, e) => {
    if (e === 'lt') return '<';
    if (e === 'gt') return '>';
    if (e === 'quot') return '"';
    if (e === 'apos') return "'";
    if (e === 'amp') return '&';
    if (e[1] === 'x' || e[1] === 'X') return String.fromCodePoint(parseInt(e.slice(2), 16));
    return String.fromCodePoint(parseInt(e.slice(1), 10));
  });
}

function xlsxAttr(attrs, name) {
  const m = String(attrs).match(new RegExp('(?:^|\\s)' + name + '="([^"]*)"'));
  return m ? m[1] : null;
}

/* ---------- 行番号の写像（Excelの行挿入・削除と同じ規則） ----------
 * op = { type: 'insert', at, n }      … at 行目の位置に n 行挿入（at 以降が下へ）
 *    | { type: 'delete', from, to }   … from〜to 行目を削除（to より下が上へ） */
function xlsxMapRow(r, op) {
  if (op.type === 'insert') return r >= op.at ? r + op.n : r;
  const k = op.to - op.from + 1;
  if (r < op.from) return r;
  if (r > op.to) return r - k;
  return null; // 削除された行
}
function xlsxMapRowRange(a, b, op) {
  if (op.type === 'insert') return [a >= op.at ? a + op.n : a, b >= op.at ? b + op.n : b];
  const k = op.to - op.from + 1;
  if (b < op.from) return [a, b];
  if (a > op.to) return [a - k, b - k];
  const na = a < op.from ? a : op.from;
  const nb = b > op.to ? b - k : op.from - 1;
  if (nb < na) return null; // 範囲ごと消えた
  return [na, nb];
}

/* "A1" / "$A$1" / "A1:B5" / "5:9" を写像。null = 消滅（#REF!） */
function xlsxMapAreaRef(ref, op) {
  let m = ref.match(/^(\$?)([A-Z]{1,3})(\$?)(\d+)(?::(\$?)([A-Z]{1,3})(\$?)(\d+))?$/);
  if (m) {
    if (!m[6]) {
      const nr = xlsxMapRow(+m[4], op);
      return nr == null ? null : m[1] + m[2] + m[3] + nr;
    }
    const r1 = +m[4], r2 = +m[8];
    const rr = xlsxMapRowRange(Math.min(r1, r2), Math.max(r1, r2), op);
    if (!rr) return null;
    return m[1] + m[2] + m[3] + rr[0] + ':' + m[5] + m[6] + m[7] + rr[1];
  }
  m = ref.match(/^(\$?)(\d+):(\$?)(\d+)$/);
  if (m) {
    const rr = xlsxMapRowRange(Math.min(+m[2], +m[4]), Math.max(+m[2], +m[4]), op);
    return rr ? m[1] + rr[0] + ':' + m[3] + rr[1] : null;
  }
  return ref; // 列全体（A:A）などは行と無関係
}
function xlsxMapSqref(sqref, op) {
  return String(sqref).trim().split(/\s+/).map(p => xlsxMapAreaRef(p, op)).filter(Boolean).join(' ');
}

/* 相対参照だけを (dRow, dCol) ずらす（共有数式の展開・行の複製用） */
function xlsxTranslateRef(ref, dRow, dCol) {
  const parts = ref.split(':');
  const out = [];
  for (const p of parts) {
    let m = p.match(/^(\$?)([A-Z]{1,3})(\$?)(\d+)$/);
    if (m) {
      let col = xlsxColIndex(m[2]);
      let row = +m[4];
      if (!m[1]) col += dCol;
      if (!m[3]) row += dRow;
      if (col < 0 || row < 1) return null;
      out.push(m[1] + xlsxColLetter(col) + m[3] + row);
      continue;
    }
    m = p.match(/^(\$?)(\d+)$/);
    if (m) {
      let row = +m[2];
      if (!m[1]) row += dRow;
      if (row < 1) return null;
      out.push(m[1] + row);
      continue;
    }
    return ref;
  }
  return out.join(':');
}

/* 数式中のセル参照を書き換える。文字列リテラルの中は触らない。
 * fn(ref, isSelfSheet, qualified) → 新しい参照 / null(#REF!) / undefined(変更なし) */
const XLSX_REF_TOKEN = /("(?:[^"]|"")*")|(?<![A-Za-z0-9_.$!\]À-￿])((?:'(?:[^']|'')+'|[A-Za-z_À-￿][A-Za-z0-9_.À-￿]*)!)?(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?|\$?\d+:\$?\d+)(?![A-Za-z0-9_(.!À-￿])/g;
function xlsxRewriteFormula(formula, fn, ctx) {
  return String(formula).replace(XLSX_REF_TOKEN, (m, str, sheet, ref) => {
    if (str) return m;
    let isSelf;
    if (sheet) {
      let nm = sheet.slice(0, -1);
      if (nm[0] === "'") nm = nm.slice(1, -1).replace(/''/g, "'");
      isSelf = ctx.selfName != null && nm === ctx.selfName;
    } else {
      isSelf = !!ctx.sameSheet;
    }
    const out = fn(ref, isSelf, !!sheet);
    if (out === undefined) return m;
    return (sheet || '') + (out === null ? '#REF!' : out);
  });
}
function xlsxTranslateFormula(formula, dRow, dCol) {
  return xlsxRewriteFormula(formula, (ref) => xlsxTranslateRef(ref, dRow, dCol), { sameSheet: true });
}
function xlsxShiftFormula(formula, op, ctx) {
  return xlsxRewriteFormula(formula, (ref, isSelf) => (isSelf ? xlsxMapAreaRef(ref, op) : undefined), ctx);
}

/* XML 中の数式テキスト（<f>, <formula>, <formula1/2>, <xm:f>）すべてに fn を適用 */
function xlsxMapFormulaTexts(xml, fn) {
  return xml.replace(/<(f|formula|formula1|formula2|xm:f)\b([^>]*)>([\s\S]*?)<\/\1>/g, (m, tag, attrs, text) => {
    if (text === '') return m;
    return '<' + tag + attrs + '>' + xlsxEscape(fn(xlsxUnescape(text))) + '</' + tag + '>';
  });
}

const XLSX_CELL_RE = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
const XLSX_ROW_RE = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;

/* 共有数式をすべて通常の数式に展開する（行の削除・複製で親子関係が壊れないように） */
function xlsxUnshareFormulas(sheetXml) {
  if (sheetXml.indexOf('t="shared"') < 0) return sheetXml;
  const masters = {};
  sheetXml.replace(XLSX_CELL_RE, (m, attrs, inner) => {
    if (!inner) return m;
    const fm = inner.match(/<f\b([^>]*)>([\s\S]*?)<\/f>/);
    if (!fm || xlsxAttr(fm[1], 't') !== 'shared' || fm[2] === '') return m;
    const si = xlsxAttr(fm[1], 'si');
    const ref = xlsxAttr(attrs, 'r');
    if (si != null && ref) masters[si] = Object.assign({ text: xlsxUnescape(fm[2]) }, xlsxRefParts(ref));
    return m;
  });
  return sheetXml.replace(XLSX_CELL_RE, (m, attrs, inner) => {
    if (!inner || inner.indexOf('<f') < 0) return m;
    const ref = xlsxAttr(attrs, 'r');
    const newInner = inner.replace(/<f\b([^>]*?)(?:\/>|>([\s\S]*?)<\/f>)/, (fm, fattrs) => {
      if (xlsxAttr(fattrs, 't') !== 'shared') return fm;
      const mst = masters[xlsxAttr(fattrs, 'si')];
      if (!mst || !ref) return fm;
      const me = xlsxRefParts(ref);
      const text = xlsxTranslateFormula(mst.text, me.row - mst.row, me.col - mst.col);
      const keep = fattrs.replace(/\s+(t|ref|si)="[^"]*"/g, '');
      return '<f' + keep + '>' + xlsxEscape(text) + '</f>';
    });
    return '<c' + attrs + '>' + newInner + '</c>';
  });
}

/* ---------- シート1枚に行操作を適用 ---------- */
function xlsxApplyRowOpToSheet(sheetXml, op, ctx) {
  let xml = sheetXml;
  const fnSelf = (t) => xlsxShiftFormula(t, op, { sameSheet: true, selfName: ctx.selfName });

  // 1) sheetData：行番号・セル番地・数式
  xml = xml.replace(/<sheetData\b[^>]*>[\s\S]*?<\/sheetData>/, (sd) => sd.replace(XLSX_ROW_RE, (rowXml, rattrs, inner) => {
    const r = parseInt(xlsxAttr(rattrs, 'r'), 10);
    if (isNaN(r)) return rowXml;
    const nr = xlsxMapRow(r, op);
    if (nr == null) return ''; // 削除
    let out = rowXml.replace(/^<row\b([^>]*?)\br="\d+"/, (mm, pre) => '<row' + pre + 'r="' + nr + '"');
    out = out.replace(/<c\b([^>]*?)\br="([A-Z]+)\d+"/g, (mm, pre, col) => '<c' + pre + 'r="' + col + nr + '"');
    // 配列数式の範囲
    out = out.replace(/(<f\b[^>]*?\bref=")([^"]+)(")/g, (mm, a, ref, b) => a + (xlsxMapSqref(ref, op) || ref) + b);
    return xlsxMapFormulaTexts(out, fnSelf);
  }));

  // 2) 結合セル（1セルになった・消えた結合は外す）
  xml = xml.replace(/<mergeCells\b[^>]*>([\s\S]*?)<\/mergeCells>/, (all, inner) => {
    const list = [];
    (inner.match(/<mergeCell\b[^>]*\/>/g) || []).forEach(mc => {
      const ref = xlsxAttr(mc, 'ref');
      const nref = ref ? xlsxMapAreaRef(ref, op) : null;
      if (!nref || nref.indexOf(':') < 0) return;
      const [p1, p2] = nref.split(':');
      if (p1 === p2) return;
      list.push('<mergeCell ref="' + nref + '"/>');
    });
    if (list.length === 0) return '';
    return '<mergeCells count="' + list.length + '">' + list.join('') + '</mergeCells>';
  });

  // 3) 条件付き書式（通常 + 拡張 x14）
  xml = xml.replace(/<conditionalFormatting\b([^>]*)>([\s\S]*?)<\/conditionalFormatting>/g, (all, attrs, inner) => {
    const sq = xlsxAttr(attrs, 'sqref');
    const nsq = sq ? xlsxMapSqref(sq, op) : '';
    if (!nsq) return '';
    return '<conditionalFormatting' + attrs.replace(/sqref="[^"]*"/, 'sqref="' + nsq + '"') + '>' +
      xlsxMapFormulaTexts(inner, fnSelf) + '</conditionalFormatting>';
  });
  xml = xml.replace(/<x14:conditionalFormatting\b([^>]*)>([\s\S]*?)<\/x14:conditionalFormatting>/g, (all, attrs, inner) => {
    const sqm = inner.match(/<xm:sqref>([\s\S]*?)<\/xm:sqref>/);
    const nsq = sqm ? xlsxMapSqref(sqm[1], op) : '';
    if (!nsq) return '';
    const body = xlsxMapFormulaTexts(inner, fnSelf).replace(/<xm:sqref>[\s\S]*?<\/xm:sqref>/, '<xm:sqref>' + nsq + '</xm:sqref>');
    return '<x14:conditionalFormatting' + attrs + '>' + body + '</x14:conditionalFormatting>';
  });

  // 4) 入力規則
  xml = xml.replace(/<dataValidations\b([^>]*)>([\s\S]*?)<\/dataValidations>/, (all, attrs, inner) => {
    const list = [];
    (inner.match(/<dataValidation\b[^>]*\/>|<dataValidation\b[^>]*>[\s\S]*?<\/dataValidation>/g) || []).forEach(dv => {
      const sq = xlsxAttr(dv.match(/^<dataValidation\b[^>]*>/)[0], 'sqref');
      const nsq = sq ? xlsxMapSqref(sq, op) : '';
      if (!nsq) return;
      list.push(xlsxMapFormulaTexts(dv.replace(/sqref="[^"]*"/, 'sqref="' + nsq + '"'), fnSelf));
    });
    if (list.length === 0) return '';
    return '<dataValidations' + attrs.replace(/count="\d+"/, 'count="' + list.length + '"') + '>' + list.join('') + '</dataValidations>';
  });

  // 5) ハイパーリンク
  xml = xml.replace(/<hyperlinks\b[^>]*>([\s\S]*?)<\/hyperlinks>/, (all, inner) => {
    const list = [];
    (inner.match(/<hyperlink\b[^>]*\/>/g) || []).forEach(h => {
      const ref = xlsxAttr(h, 'ref');
      const nref = ref ? xlsxMapSqref(ref, op) : '';
      if (nref) list.push(h.replace(/\bref="[^"]*"/, 'ref="' + nref + '"'));
    });
    return list.length ? '<hyperlinks>' + list.join('') + '</hyperlinks>' : '';
  });

  // 6) 使用範囲・オートフィルタ・選択位置
  xml = xml.replace(/(<dimension\b[^>]*\bref=")([^"]+)(")/, (m, a, ref, b) => a + (xlsxMapAreaRef(ref, op) || 'A1') + b);
  xml = xml.replace(/(<autoFilter\b[^>]*\bref=")([^"]+)(")/, (m, a, ref, b) => a + (xlsxMapAreaRef(ref, op) || ref) + b);
  xml = xml.replace(/<selection\b[^>]*\/>/g, (sel) => sel
    .replace(/activeCell="[^"]*"/, (m) => { const v = xlsxMapAreaRef(m.slice(12, -1), op); return 'activeCell="' + (v || 'A1') + '"'; })
    .replace(/sqref="[^"]*"/, (m) => { const v = xlsxMapSqref(m.slice(7, -1), op); return 'sqref="' + (v || 'A1') + '"'; }));

  // 7) 改ページ（id = その行の下で改ページ）
  xml = xml.replace(/<rowBreaks\b([^>]*)>([\s\S]*?)<\/rowBreaks>/, (all, attrs, inner) => {
    const list = [];
    (inner.match(/<brk\b[^>]*\/>/g) || []).forEach(b => {
      const id = parseInt(xlsxAttr(b, 'id'), 10);
      const nr = xlsxMapRow(id + 1, op);
      if (nr == null || nr - 1 < 1) return;
      list.push(b.replace(/\bid="\d+"/, 'id="' + (nr - 1) + '"'));
    });
    if (list.length === 0) return '';
    const manual = list.filter(b => /\bman="1"/.test(b)).length;
    return '<rowBreaks' + attrs.replace(/count="\d+"/, 'count="' + list.length + '"')
      .replace(/manualBreakCount="\d+"/, 'manualBreakCount="' + manual + '"') + '>' + list.join('') + '</rowBreaks>';
  });

  return xml;
}

/* 行を挿入し、挿入した行は「挿入位置にあった行（=スタッフ欄の最終行）」の書式・行内数式を複製する */
function xlsxInsertRowsAndClone(sheetXml, at, n, ctx) {
  const op = { type: 'insert', at, n };
  let xml = xlsxApplyRowOpToSheet(sheetXml, op, ctx);
  const protoR = at + n; // 元の at 行は押し下げられてここにある
  const rowRe = new RegExp('<row\\b[^>]*?\\br="' + protoR + '"[^>]*?(?:\\/>|>[\\s\\S]*?<\\/row>)');
  const pm = xml.match(rowRe);

  let clones = '';
  for (let i = 0; i < n; i++) {
    const nr = at + i;
    if (!pm) { clones += '<row r="' + nr + '"></row>'; continue; }
    let rx = pm[0];
    if (/\/>$/.test(rx)) rx = rx.replace(/\/>$/, '></row>');
    rx = rx.replace(/^<row\b([^>]*?)\br="\d+"/, (m, pre) => '<row' + pre + 'r="' + nr + '"');
    rx = rx.replace(XLSX_CELL_RE, (m, attrs, inner) => {
      const a = attrs.replace(/\br="([A-Z]+)\d+"/, (mm, col) => 'r="' + col + nr + '"').replace(/\s+t="[^"]*"/, '');
      const fm = inner && inner.match(/<f\b([^>]*?)>([\s\S]*?)<\/f>/);
      if (fm && fm[2] !== '' && xlsxAttr(fm[1], 't') !== 'array') {
        // 行ごとの数式（例: =COUNTIF(E25:AI25,"休")）は行をずらして引き継ぐ
        const text = xlsxTranslateFormula(xlsxUnescape(fm[2]), nr - protoR, 0);
        return '<c' + a + '><f>' + xlsxEscape(text) + '</f></c>';
      }
      return '<c' + a + '/>'; // 値は空・書式（罫線・塗り）は維持
    });
    clones += rx;
  }
  if (pm) xml = xml.replace(pm[0], () => clones + pm[0]);
  else xml = xml.replace('</sheetData>', () => clones + '</sheetData>');

  // 雛形行の中だけで閉じた横結合（例: B25:C25）は新しい行にも作る
  if (pm) {
    xml = xml.replace(/<mergeCells\b[^>]*>([\s\S]*?)<\/mergeCells>/, (all, inner) => {
      const add = [];
      (inner.match(/<mergeCell\b[^>]*\/>/g) || []).forEach(mc => {
        const m = (xlsxAttr(mc, 'ref') || '').match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);
        if (!m || +m[2] !== protoR || +m[4] !== protoR) return;
        for (let i = 0; i < n; i++) add.push('<mergeCell ref="' + m[1] + (at + i) + ':' + m[3] + (at + i) + '"/>');
      });
      if (add.length === 0) return all;
      const total = (inner.match(/<mergeCell\b/g) || []).length + add.length;
      return '<mergeCells count="' + total + '">' + inner + add.join('') + '</mergeCells>';
    });
  }
  return xml;
}

/* ---------- 図形・コメント・テーブルの追随 ---------- */
function xlsxResolvePartPath(baseDir, target) {
  if (target.startsWith('/')) return target.slice(1);
  const parts = (baseDir + target).split('/');
  const out = [];
  for (const p of parts) {
    if (p === '..') out.pop();
    else if (p !== '.' && p !== '') out.push(p);
  }
  return out.join('/');
}
function xlsxSheetRelParts(files, sheetPath) {
  const dir = sheetPath.slice(0, sheetPath.lastIndexOf('/') + 1);
  const relsPath = dir + '_rels/' + sheetPath.slice(dir.length) + '.rels';
  const rels = files[relsPath] || '';
  const out = [];
  (rels.match(/<Relationship\b[^>]*\/>/g) || []).forEach(r => {
    const type = xlsxAttr(r, 'Type') || '';
    const target = xlsxAttr(r, 'Target') || '';
    if (xlsxAttr(r, 'TargetMode') === 'External') return;
    out.push({ type: type.slice(type.lastIndexOf('/') + 1), path: xlsxResolvePartPath(dir, target) });
  });
  return out;
}
function xlsxApplyRowOpToDrawing(xml, op) {
  // 接頭辞（Excelは "xdr:"、ツールによっては無し）に依存しないように取り出す
  const pm = xml.match(/<([A-Za-z0-9]+:)?wsDr\b/);
  const P = pm && pm[1] ? pm[1] : '';
  const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const p = esc(P);
  const mapAnchorRow = (r0) => {
    const nr = xlsxMapRow(r0 + 1, op);
    return (nr == null ? op.from : nr) - 1; // 削除行にかかる図形は削除位置へ寄せる
  };
  const rowOf = (block, tag) => {
    const m = block.match(new RegExp('<' + p + tag + '>[\\s\\S]*?<' + p + 'row>(\\d+)</' + p + 'row>'));
    return m ? parseInt(m[1], 10) : null;
  };
  const setRow = (block, tag, v) => block.replace(
    new RegExp('(<' + p + tag + '>[\\s\\S]*?<' + p + 'row>)\\d+(</' + p + 'row>)'), '$1' + v + '$2');
  xml = xml.replace(new RegExp('<' + p + 'twoCellAnchor\\b([^>]*)>([\\s\\S]*?)</' + p + 'twoCellAnchor>', 'g'), (all, attrs, inner) => {
    const editAs = xlsxAttr(attrs, 'editAs');
    if (editAs === 'absolute') return all; // セルに合わせて動かない設定
    const f = rowOf(inner, 'from'), t = rowOf(inner, 'to');
    if (f == null) return all;
    const nf = mapAnchorRow(f);
    let body = setRow(inner, 'from', nf);
    if (t != null) body = setRow(body, 'to', editAs === 'oneCell' ? t + (nf - f) : Math.max(nf, mapAnchorRow(t)));
    return '<' + P + 'twoCellAnchor' + attrs + '>' + body + '</' + P + 'twoCellAnchor>';
  });
  xml = xml.replace(new RegExp('<' + p + 'oneCellAnchor\\b([^>]*)>([\\s\\S]*?)</' + p + 'oneCellAnchor>', 'g'), (all, attrs, inner) => {
    const f = rowOf(inner, 'from');
    if (f == null) return all;
    return '<' + P + 'oneCellAnchor' + attrs + '>' + setRow(inner, 'from', mapAnchorRow(f)) + '</' + P + 'oneCellAnchor>';
  });
  return xml;
}
function xlsxApplyRowOpToComments(xml, op, removedCells) {
  return xml.replace(/<comment\b([^>]*)>([\s\S]*?)<\/comment>/g, (all, attrs, inner) => {
    const ref = xlsxAttr(attrs, 'ref');
    const nref = ref ? xlsxMapAreaRef(ref, op) : null;
    if (!nref) { if (ref) removedCells.push(ref); return ''; }
    return '<comment' + attrs.replace(/\bref="[^"]*"/, 'ref="' + nref + '"') + '>' + inner + '</comment>';
  });
}
function xlsxApplyRowOpToVml(xml, op, removedCells) {
  const removed = new Set(removedCells.map(r => { const p = xlsxRefParts(r); return (p.row - 1) + ',' + p.col; }));
  return xml.replace(/<v:shape\b[\s\S]*?<\/v:shape>/g, (shape) => {
    const rm = shape.match(/<x:Row>(\d+)<\/x:Row>/);
    const cm = shape.match(/<x:Column>(\d+)<\/x:Column>/);
    if (!rm) return shape;
    const r0 = parseInt(rm[1], 10);
    if (cm && removed.has(r0 + ',' + parseInt(cm[1], 10))) return '';
    const nr = xlsxMapRow(r0 + 1, op);
    if (nr == null) return '';
    const delta = (nr - 1) - r0;
    let out = shape.replace(/<x:Row>\d+<\/x:Row>/, '<x:Row>' + (nr - 1) + '</x:Row>');
    out = out.replace(/<x:Anchor>([^<]*)<\/x:Anchor>/, (m, a) => {
      const v = a.split(',').map(x => x.trim());
      if (v.length !== 8) return m;
      v[2] = String(Math.max(0, parseInt(v[2], 10) + delta));
      v[6] = String(Math.max(0, parseInt(v[6], 10) + delta));
      return '<x:Anchor>' + v.join(', ') + '</x:Anchor>';
    });
    return out;
  });
}

/* ブック全体に行操作を反映（対象シート・他シートの参照・名前定義・図形・コメント・テーブル） */
function xlsxApplyRowOpToPackage(files, sheetPath, op, ctx) {
  const sheetPaths = Object.keys(files).filter(p => /^xl\/worksheets\/[^/]+\.xml$/.test(p));
  // 他のシートからこのシートへの参照
  sheetPaths.forEach(p => {
    if (p === sheetPath) return;
    if (ctx.selfName == null || files[p].indexOf(ctx.selfName) < 0) return;
    files[p] = xlsxMapFormulaTexts(xlsxUnshareFormulas(files[p]),
      (t) => xlsxShiftFormula(t, op, { sameSheet: false, selfName: ctx.selfName }));
  });
  // 名前定義（印刷範囲・印刷タイトルなど）
  if (files['xl/workbook.xml']) {
    files['xl/workbook.xml'] = files['xl/workbook.xml'].replace(/<definedName\b([^>]*)>([\s\S]*?)<\/definedName>/g, (all, attrs, text) => {
      const nt = xlsxShiftFormula(xlsxUnescape(text), op, { sameSheet: false, selfName: ctx.selfName });
      return '<definedName' + attrs + '>' + xlsxEscape(nt) + '</definedName>';
    });
  }
  // シートに付属するパーツ
  const removedComments = [];
  const parts = xlsxSheetRelParts(files, sheetPath);
  parts.filter(p => p.type === 'drawing').forEach(p => { if (files[p.path]) files[p.path] = xlsxApplyRowOpToDrawing(files[p.path], op); });
  parts.filter(p => p.type === 'comments').forEach(p => { if (files[p.path]) files[p.path] = xlsxApplyRowOpToComments(files[p.path], op, removedComments); });
  parts.filter(p => p.type === 'vmlDrawing').forEach(p => { if (files[p.path]) files[p.path] = xlsxApplyRowOpToVml(files[p.path], op, removedComments); });
  parts.filter(p => p.type === 'table').forEach(p => {
    if (!files[p.path]) return;
    files[p.path] = files[p.path].replace(/(<(?:table|autoFilter)\b[^>]*?\bref=")([^"]+)(")/g,
      (m, a, ref, b) => a + (xlsxMapAreaRef(ref, op) || ref) + b);
  });
}

/* ---------- 共有文字列 ---------- */
function xlsxSstText(si) {
  const body = si.replace(/<rPh\b[\s\S]*?<\/rPh>/g, ''); // ふりがなは除く
  let s = '';
  body.replace(/<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g, (m, t) => { s += t ? xlsxUnescape(t) : ''; return m; });
  return s;
}
function createXlsxSharedStrings(xml) {
  const items = [];
  const texts = [];
  const map = new Map();
  let openTag = '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if (xml) {
    const om = xml.match(/<sst\b[^>]*?(?:\/>|>)/);
    if (om) openTag = om[0].replace(/\/>$/, '>');
    (xml.match(/<si\b[^>]*\/>|<si\b[^>]*>[\s\S]*?<\/si>/g) || []).forEach((si, i) => {
      items.push(si);
      const t = xlsxSstText(si);
      texts.push(t);
      if (!/<r\b/.test(si) && !map.has(t)) map.set(t, i);
    });
  }
  return {
    texts,
    addRaw(siInner) { // 書式つき（リッチテキスト）はそのまま1件として追加
      items.push('<si>' + siInner + '</si>');
      texts.push(xlsxSstText('<si>' + siInner + '</si>'));
      return items.length - 1;
    },
    add(text) {
      const t = String(text);
      if (map.has(t)) return map.get(t);
      const preserve = /^\s|\s$|\n/.test(t) ? ' xml:space="preserve"' : '';
      items.push('<si><t' + preserve + '>' + xlsxEscape(t) + '</t></si>');
      texts.push(t);
      map.set(t, items.length - 1);
      return items.length - 1;
    },
    output(totalRefs) {
      let open = openTag.replace(/\s+(count|uniqueCount)="\d+"/g, '');
      open = open.replace(/^<sst\b/, '<sst count="' + totalRefs + '" uniqueCount="' + items.length + '"');
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + open + items.join('') + '</sst>';
    },
  };
}

/* ---------- セル読み取り ---------- */
function xlsxReadRowCells(sheetXml, r, sstTexts) {
  const rowRe = new RegExp('<row\\b[^>]*?\\br="' + r + '"[^>]*?(?:\\/>|>([\\s\\S]*?)<\\/row>)');
  const m = sheetXml.match(rowRe);
  if (!m) return null;
  const cells = {};
  (m[1] || '').replace(XLSX_CELL_RE, (cm, attrs, inner) => {
    const ref = xlsxAttr(attrs, 'r');
    if (!ref) return cm;
    const p = xlsxRefParts(ref);
    const t = xlsxAttr(attrs, 't');
    const s = xlsxAttr(attrs, 's');
    const hasF = !!inner && /<f\b/.test(inner);
    let text = '';
    if (inner && !hasF) {
      if (t === 's') { const v = inner.match(/<v>([\s\S]*?)<\/v>/); text = v ? (sstTexts[parseInt(v[1], 10)] || '') : ''; }
      else if (t === 'inlineStr') text = xlsxSstText(inner);
      else { const v = inner.match(/<v>([\s\S]*?)<\/v>/); text = v ? xlsxUnescape(v[1]) : ''; }
    }
    cells[p.col] = { ref, col: p.col, s: s == null ? 0 : parseInt(s, 10), t, hasF, text: String(text).trim(), isNum: (!t || t === 'n') && !hasF && /<v>/.test(inner || '') };
    return cm;
  });
  return cells;
}
function xlsxParseMerges(sheetXml) {
  const out = [];
  (sheetXml.match(/<mergeCell\b[^>]*\/>/g) || []).forEach(mc => {
    const m = (xlsxAttr(mc, 'ref') || '').match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);
    if (m) out.push({ c1: xlsxColIndex(m[1]), r1: +m[2], c2: xlsxColIndex(m[3]), r2: +m[4] });
  });
  return out;
}
function xlsxStyleHasBorder(stylesXml) {
  const sec = (tag) => { const m = stylesXml.match(new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)</' + tag + '>')); return m ? m[1] : ''; };
  const borders = (sec('borders').match(/<border\b[^>]*\/>|<border\b[^>]*>[\s\S]*?<\/border>/g) || [])
    .map(b => /\bstyle="(?!none)[^"]+"/.test(b));
  const xfs = (sec('cellXfs').match(/<xf\b[^>]*\/>|<xf\b[^>]*>[\s\S]*?<\/xf>/g) || [])
    .map(x => { const id = xlsxAttr(x.match(/^<xf\b[^>]*>/)[0], 'borderId'); return !!borders[id == null ? 0 : parseInt(id, 10)]; });
  return (sIdx) => !!xfs[sIdx || 0];
}

/* ---------- スタッフ欄の自動検出 ----------
 * startRow から下へ「スタッフ行らしい行」が続く数を数える。次のどれかで終わり:
 *  - 行が無い／セルが1つも無い
 *  - A〜D列に「合計・計・人数・出勤数・備考・※」などの見出し
 *  - 1行目に無かった列に数式がある（合計行・集計行）
 *  - 名前列の罫線の有無が1行目と違い、かつ名前が空（区切りの空行）
 *  - 名前列の結合のしかたが1行目と違う
 * 前月に出力したファイル（名前が入っている）をテンプレにしても正しく数えられる。 */
const XLSX_SUMMARY_RE = /^(合計|小計|総計|計|集計|人数|出勤|休日|備考|※|【)/;
function xlsxAnalyzeStaffBlock(sheetXml, stylesXml, sstTexts, layout) {
  const startRow = layout.startRow;
  const nameCol = layout.nameCol;          // 0-based（B=1）
  const dayCol0 = layout.dayStartCol;      // 0-based（E=4）
  const hasBorder = xlsxStyleHasBorder(stylesXml || '');
  const merges = xlsxParseMerges(sheetXml);
  const mergeSig = (r, c) => {
    const m = merges.find(mm => r >= mm.r1 && r <= mm.r2 && c >= mm.c1 && c <= mm.c2);
    return m ? (m.c2 - m.c1 + 1) + 'x' + (m.r2 - m.r1 + 1) : '1x1';
  };

  const first = xlsxReadRowCells(sheetXml, startRow, sstTexts);
  if (!first || Object.keys(first).length === 0) {
    return { startRow, rows: 0, filled: 0, numbered: false };
  }
  const rowFormulaCols = new Set(Object.values(first).filter(c => c.hasF).map(c => c.col));
  const firstBorder = first[nameCol] ? hasBorder(first[nameCol].s) : false;
  const firstMerge = mergeSig(startRow, nameCol);

  let rows = 0, filled = 0;
  const aNums = [];
  for (let r = startRow; r < startRow + 300; r++) {
    const cells = r === startRow ? first : xlsxReadRowCells(sheetXml, r, sstTexts);
    if (!cells || Object.keys(cells).length === 0) break;
    if (r !== startRow) {
      let stop = false;
      for (let c = 0; c <= Math.max(nameCol, dayCol0 - 1); c++) {
        if (cells[c] && cells[c].text && XLSX_SUMMARY_RE.test(cells[c].text)) { stop = true; break; }
      }
      if (stop) break;
      if (Object.values(cells).some(c => c.hasF && !rowFormulaCols.has(c.col))) break;
      const nc = cells[nameCol];
      const nameText = nc ? nc.text : '';
      if (!nameText && firstBorder && !(nc && hasBorder(nc.s))) break;
      if (mergeSig(r, nameCol) !== firstMerge) break;
    }
    rows++;
    if (cells[nameCol] && cells[nameCol].text) filled++;
    const a = cells[0];
    aNums.push(a && a.isNum && /^\d+$/.test(a.text) ? parseInt(a.text, 10) : (a && a.text ? NaN : null));
  }
  // A列が 1,2,3… の連番なら「No.欄」とみなして出力時に振り直す
  const nums = aNums.filter(v => v != null);
  const numbered = nums.length >= 2 && nums.every((v, i) => v === i + 1) && aNums.slice(0, nums.length).every(v => v != null);
  return { startRow, rows, filled, numbered };
}

/* ---------- セル書き込み（数式セルは触らない・文字列は共有文字列） ---------- */
function xlsxBuildCellXml(ref, spec, sst) {
  const sAttr = (spec.styleIdx != null) ? ' s="' + spec.styleIdx + '"' : '';
  if (spec.dateSerial != null) return '<c r="' + ref + '"' + sAttr + '><v>' + spec.dateSerial + '</v></c>';
  if (spec.number != null) return '<c r="' + ref + '"' + sAttr + '><v>' + spec.number + '</v></c>';
  const v = spec.value == null ? '' : String(spec.value);
  if (v === '') return '<c r="' + ref + '"' + sAttr + '/>';
  if (sst) return '<c r="' + ref + '"' + sAttr + ' t="s"><v>' + sst.add(v) + '</v></c>';
  return '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + xlsxEscape(v) + '</t></is></c>';
}

/* セル値の一括書き換え。既存セルは値だけ差し替え（s属性維持）、
 * 無いセル・行は正しい位置に挿入する。★数式の入ったセルはスキップして opts.skipped に積む */
function xlsxSetCells(sheetXml, cellSpecs, opts) {
  const o = opts || {};
  const sst = o.sst || null;
  const skipped = o.skipped || [];
  const byRow = {};
  Object.keys(cellSpecs).forEach(ref => {
    const { row } = xlsxRefParts(ref);
    (byRow[row] = byRow[row] || []).push(ref);
  });

  let xml = sheetXml;
  Object.keys(byRow).map(Number).sort((a, b) => a - b).forEach(rowNum => {
    const rowRe = new RegExp('<row\\b[^>]*?\\br="' + rowNum + '"[^>]*?(?:\\/>|>[\\s\\S]*?<\\/row>)');
    const rowM = xml.match(rowRe);
    let rowXml;
    if (rowM) {
      rowXml = rowM[0];
      if (/\/>$/.test(rowXml)) rowXml = rowXml.replace(/\/>$/, '></row>');
    } else {
      rowXml = '<row r="' + rowNum + '"></row>';
    }

    byRow[rowNum].sort((a, b) => xlsxRefParts(a).col - xlsxRefParts(b).col).forEach(ref => {
      const spec = cellSpecs[ref];
      const cellRe = new RegExp('<c\\b[^>]*?\\br="' + ref + '"[^>]*?(?:\\/>|>[\\s\\S]*?<\\/c>)');
      const cm = rowXml.match(cellRe);
      if (cm && /<f\b/.test(cm[0])) { skipped.push(ref); return; } // 数式は保持
      let styleIdx = spec.styleIdx;
      if (styleIdx === undefined) {
        const sm = cm && cm[0].match(/^<c\b[^>]*?\bs="(\d+)"/);
        styleIdx = sm ? parseInt(sm[1]) : null;
      }
      const newCell = xlsxBuildCellXml(ref, Object.assign({}, spec, { styleIdx }), sst);
      if (cm) {
        rowXml = rowXml.replace(cm[0], () => newCell);
      } else {
        const myCol = xlsxRefParts(ref).col;
        const cells = rowXml.match(/<c\b[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g) || [];
        let inserted = false;
        for (const c of cells) {
          const crm = c.match(/\br="([A-Z]+\d+)"/);
          if (crm && xlsxRefParts(crm[1]).col > myCol) {
            rowXml = rowXml.replace(c, () => newCell + c);
            inserted = true;
            break;
          }
        }
        if (!inserted) rowXml = rowXml.replace(/<\/row>$/, () => newCell + '</row>');
      }
    });

    if (rowM) {
      xml = xml.replace(rowM[0], () => rowXml);
    } else {
      const rows = xml.match(/<row\b[^>]*?(?:\/>|>)/g) || [];
      let insertBefore = null;
      for (const r of rows) {
        const rr = parseInt(xlsxAttr(r, 'r'), 10);
        if (rr > rowNum) { insertBefore = r; break; }
      }
      if (insertBefore) xml = xml.replace(insertBefore, () => rowXml + insertBefore);
      else xml = xml.replace('</sheetData>', () => rowXml + '</sheetData>');
    }
  });
  return xml;
}

/* シフトデータからセル書き込み指定を組み立てる（純粋関数）
 * 戻り値: { 'B6': { value, fontRgb?, fillRgb?, dayCell? }, 'A2': { dateSerial }, ... } */
function buildExcelCellSpecs(year, month, days, orderedStaff, groups, getShiftFn, opts) {
  const o = opts || {};
  const startRow = o.startRow || 6;       // 1-based
  const startDayCol = o.startDayCol || 5; // E列（1-based）
  const blockRows = Math.max(o.blockRows || 0, orderedStaff.length);

  const specs = {};
  // A2: 月日（テンプレの表示形式そのまま・シリアル値で書く）
  specs['A2'] = { dateSerial: Math.round((Date.UTC(year, month - 1, 1) - Date.UTC(1899, 11, 30)) / 86400000) };

  // スタッフ欄をクリア（値のみ空に・スタイル維持）
  for (let r = startRow; r < startRow + blockRows; r++) {
    specs['B' + r] = { value: '', cleanFill: true };
    specs['C' + r] = { value: '', cleanFill: true };
    specs['D' + r] = { value: '', cleanFill: true };
    for (let dc = 0; dc < XLSX_DAY_COLS; dc++) {
      specs[xlsxColLetter(startDayCol - 1 + dc) + r] = { value: '', cleanFill: true, dayCell: true };
    }
    if (o.numbered) specs['A' + r] = { value: '' };
  }

  orderedStaff.forEach((s, idx) => {
    const rowNum = startRow + idx;
    const group = groups.find(g => g.id === s.groupId);
    const rowFill = group ? XLSX_GROUP_FILL[group.color] : null;

    if (o.numbered) specs['A' + rowNum] = { number: idx + 1 };
    specs['B' + rowNum] = { value: s.name, fillRgb: rowFill || undefined, cleanFill: true };
    specs['C' + rowNum] = { value: formatTime(s.startHour, s.startMin), fillRgb: rowFill || undefined, cleanFill: true };
    specs['D' + rowNum] = { value: formatTime(s.endHour, s.endMin), fillRgb: rowFill || undefined, cleanFill: true };

    for (let d = 1; d <= days; d++) {
      const t = getShiftFn(s.id, d);
      const def = SHIFT_TYPES[t] || SHIFT_TYPES[''];
      const ref = xlsxColLetter(startDayCol - 1 + (d - 1)) + rowNum;
      const spec = { value: def.excel || '', cleanFill: true, dayCell: true };
      // 希望休は赤字。ICスタッフは休みの種類を問わず赤字
      if (t === 'holiday' || (s.category === 'ICスタッフ' && def.countAsHoliday)) spec.fontRgb = XLSX_RED;
      if (rowFill) spec.fillRgb = rowFill;
      specs[ref] = spec;
    }
  });
  return specs;
}

/* 計算チェーンを削除し、開いたときに全数式を再計算させる */
function xlsxDropCalcChain(files, removed) {
  const ct = files['[Content_Types].xml'];
  if (files['xl/calcChain.xml'] !== undefined) { delete files['xl/calcChain.xml']; removed.push('xl/calcChain.xml'); }
  if (ct) files['[Content_Types].xml'] = ct.replace(/<Override\b[^>]*PartName="\/xl\/calcChain\.xml"[^>]*\/>/g, '');
  const relsPath = 'xl/_rels/workbook.xml.rels';
  if (files[relsPath]) files[relsPath] = files[relsPath].replace(/<Relationship\b[^>]*Target="[^"]*calcChain\.xml"[^>]*\/>/g, '');
  let wb = files['xl/workbook.xml'];
  if (!wb) return;
  if (/<calcPr\b/.test(wb)) {
    wb = wb.replace(/<calcPr\b([^>]*?)(\/?)>/, (m, attrs, slash) => {
      const a = /fullCalcOnLoad="/.test(attrs) ? attrs.replace(/fullCalcOnLoad="[^"]*"/, 'fullCalcOnLoad="1"') : attrs + ' fullCalcOnLoad="1"';
      return '<calcPr' + a + slash + '>';
    });
  } else if (/<\/definedNames>/.test(wb)) {
    wb = wb.replace('</definedNames>', '</definedNames><calcPr fullCalcOnLoad="1"/>');
  } else {
    wb = wb.replace('</sheets>', '</sheets><calcPr fullCalcOnLoad="1"/>');
  }
  files['xl/workbook.xml'] = wb;
}

/* 共有文字列パーツの場所（無ければ作る） */
function xlsxEnsureSharedStringsPart(files) {
  const relsPath = 'xl/_rels/workbook.xml.rels';
  const rels = files[relsPath] || '';
  const rel = (rels.match(/<Relationship\b[^>]*\/>/g) || []).find(r => /\/sharedStrings"/.test(r));
  if (rel) return xlsxResolvePartPath('xl/', xlsxAttr(rel, 'Target'));
  const path = 'xl/sharedStrings.xml';
  let id = 1;
  while (rels.indexOf('Id="rId' + id + '"') >= 0) id++;
  files[relsPath] = rels.replace('</Relationships>',
    '<Relationship Id="rId' + id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>');
  const ct = files['[Content_Types].xml'] || '';
  if (ct.indexOf('/xl/sharedStrings.xml') < 0) {
    files['[Content_Types].xml'] = ct.replace('</Types>',
      '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>');
  }
  return path;
}

/* ======================================================================
 * パッケージ変換（純粋関数）
 * files: { 'xl/workbook.xml': '...', ... } … xlsx 内のテキストパート（xml / rels / vml）
 * 戻り値: { files, removed, info }
 * ====================================================================== */
function xlsxTransformPackage(inFiles, p) {
  const files = Object.assign({}, inFiles);
  const removed = [];
  const layout = Object.assign({ startRow: 6, rows: 0, nameCol: 1, dayStartCol: 4 }, p.layout || {});

  const workbookXml = files['xl/workbook.xml'];
  if (!workbookXml) throw new Error('テンプレに workbook.xml がありません（.xlsx 形式か確認してください）');
  const sheetPath = xlsxResolveSheetPath(workbookXml, files['xl/_rels/workbook.xml.rels'] || '');
  if (files[sheetPath] == null) throw new Error('テンプレ内にシートが見つかりません: ' + sheetPath);
  const sheetTag = workbookXml.match(/<sheet\b[^>]*?\/?>/);
  const selfName = sheetTag ? xlsxUnescape(xlsxAttr(sheetTag[0], 'name') || '') : null;
  const ctx = { selfName };

  const sstPath = xlsxEnsureSharedStringsPart(files);
  const sst = createXlsxSharedStrings(files[sstPath] || null);
  let stylesXml = files['xl/styles.xml'] || '';

  // 共有数式を展開してから構造をいじる
  let sheetXml = xlsxUnshareFormulas(files[sheetPath]);

  // スタッフ欄の検出（設定で行数が指定されていればそれを優先）
  const analysis = xlsxAnalyzeStaffBlock(sheetXml, stylesXml, sst.texts, layout);
  const templateRows = layout.rows > 0 ? layout.rows : analysis.rows;
  const n = p.orderedStaff.length;
  const target = Math.max(1, n);
  let added = 0, deleted = 0;

  if (templateRows > 0 && target > templateRows) {
    added = target - templateRows;
    const at = layout.startRow + templateRows - 1; // スタッフ欄の最終行の位置に挿入 → 合計式の範囲も広がる
    files[sheetPath] = sheetXml;
    xlsxApplyRowOpToPackage(files, sheetPath, { type: 'insert', at, n: added }, ctx);
    sheetXml = xlsxInsertRowsAndClone(files[sheetPath], at, added, ctx);
  } else if (templateRows > 0 && target < templateRows) {
    deleted = templateRows - target;
    const op = { type: 'delete', from: layout.startRow + target, to: layout.startRow + templateRows - 1 };
    files[sheetPath] = sheetXml;
    xlsxApplyRowOpToPackage(files, sheetPath, op, ctx);
    sheetXml = xlsxApplyRowOpToSheet(files[sheetPath], op, ctx);
  }

  // 書き込み内容
  const specs = buildExcelCellSpecs(p.year, p.month, p.days, p.orderedStaff, p.groups, p.getShift, {
    startRow: layout.startRow,
    startDayCol: layout.dayStartCol + 1,
    blockRows: templateRows > 0 ? target : n,
    numbered: analysis.numbered,
  });

  // スタイル：前月の色（グループ色・赤字）を落としてから今月の色を載せる
  const styler = createXlsxStyleEditor(stylesXml);
  Object.keys(specs).forEach(ref => {
    const sp = specs[ref];
    if (!sp.cleanFill && !sp.fontRgb && !sp.fillRgb) return;
    const orig = xlsxGetCellStyleIdx(sheetXml, ref);
    let base = orig == null ? 0 : orig;
    if (sp.cleanFill) base = styler.clean(base, { fill: true, font: !!sp.dayCell });
    sp.styleIdx = (sp.fontRgb || sp.fillRgb) ? styler.variant(base, sp.fontRgb, sp.fillRgb) : (orig == null && base === 0 ? undefined : base);
  });

  const skipped = [];
  sheetXml = xlsxSetCells(sheetXml, specs, { sst, skipped });

  // シート内に残っているインライン文字列（古い出力やツール製テンプレ由来）も共有文字列へ寄せる
  sheetXml = sheetXml.replace(XLSX_CELL_RE, (m, attrs, inner) => {
    if (xlsxAttr(attrs, 't') !== 'inlineStr' || !inner) return m;
    const is = inner.match(/<is>([\s\S]*?)<\/is>/);
    if (!is) return m;
    const plain = !/<r\b/.test(is[1]);
    const idx = plain ? sst.add(xlsxSstText('<si>' + is[1] + '</si>')) : sst.addRaw(is[1]);
    return '<c' + attrs.replace(/\bt="inlineStr"/, 't="s"') + '><v>' + idx + '</v></c>';
  });
  files[sheetPath] = sheetXml;
  files['xl/styles.xml'] = styler.output();

  // 計算チェーン削除＋再計算フラグ
  xlsxDropCalcChain(files, removed);

  // 共有文字列（参照数はブック全体の t="s" の数）
  let refs = 0;
  Object.keys(files).filter(k => /^xl\/worksheets\/[^/]+\.xml$/.test(k)).forEach(k => {
    refs += (files[k].match(/<c\b[^>]*?\bt="s"/g) || []).length;
  });
  files[sstPath] = sst.output(refs);

  return {
    files,
    removed,
    info: {
      sheetName: selfName,
      startRow: layout.startRow,
      detectedRows: analysis.rows,
      templateRows,
      filledInTemplate: analysis.filled,
      staff: n,
      added,
      deleted,
      numbered: analysis.numbered,
      skippedFormulaCells: skipped,
    },
  };
}

/* シートXMLから既存セルのスタイルidxを取得（セル無し=null） */
function xlsxGetCellStyleIdx(sheetXml, ref) {
  const m = sheetXml.match(new RegExp('<c\\b[^>]*?\\br="' + ref + '"[^>]*?(?:\\/>|>)'));
  if (!m) return null;
  const s = xlsxAttr(m[0].replace(/\/?>$/, ''), 's');
  return s == null ? 0 : parseInt(s, 10);
}

/* ---------- Excel出力のレイアウト設定（このブラウザに保存） ---------- */
const EXCEL_LAYOUT_KEY = 'shift_excel_layout_v1';
function getExcelLayout() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(EXCEL_LAYOUT_KEY) || '{}') || {}; } catch (e) { v = {}; }
  const startRow = Math.max(1, Math.min(500, parseInt(v.startRow, 10) || 6));
  const rows = Math.max(0, Math.min(300, parseInt(v.rows, 10) || 0));
  return { startRow, rows };
}
function saveExcelLayout(layout) {
  try { localStorage.setItem(EXCEL_LAYOUT_KEY, JSON.stringify(layout)); } catch (e) { console.error(e); }
}

/* xlsx（base64）からテキストパートを取り出す */
async function xlsxLoadTextParts(base64) {
  await ensureJSZip();
  const zip = await JSZip.loadAsync(base64, { base64: true });
  const files = {};
  const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && /\.(xml|rels|vml)$/i.test(n));
  for (const n of names) files[n] = await zip.file(n).async('string');
  return { zip, files };
}

/* 登録済みテンプレのスタッフ欄を解析（設定画面の表示用） */
async function analyzeStoredTemplate() {
  const b64 = await getStoredTemplate();
  if (!b64) return null;
  const { files } = await xlsxLoadTextParts(b64);
  const wb = files['xl/workbook.xml'];
  const sheetPath = xlsxResolveSheetPath(wb, files['xl/_rels/workbook.xml.rels'] || '');
  const relsXml = files['xl/_rels/workbook.xml.rels'] || '';
  const rel = (relsXml.match(/<Relationship\b[^>]*\/>/g) || []).find(r => /\/sharedStrings"/.test(r));
  const sstXml = rel ? files[xlsxResolvePartPath('xl/', xlsxAttr(rel, 'Target'))] : null;
  const sst = createXlsxSharedStrings(sstXml || null);
  const layout = Object.assign({ nameCol: 1, dayStartCol: 4 }, getExcelLayout());
  const a = xlsxAnalyzeStaffBlock(xlsxUnshareFormulas(files[sheetPath] || ''), files['xl/styles.xml'] || '', sst.texts, layout);
  return a;
}

async function generateExcelFromTemplate(base64) {
  try {
    const { zip, files } = await xlsxLoadTextParts(base64);

    const ym = state.currentMonth;
    const { year, month } = parseMonth(ym);
    const days = daysInMonth(ym);

    const orderedStaff = [];
    CATEGORIES.forEach(cat => {
      state.staff.filter(s => s.category === cat).forEach(s => orderedStaff.push(s));
    });

    const res = xlsxTransformPackage(files, {
      year, month, days, orderedStaff,
      groups: state.groups,
      getShift,
      layout: getExcelLayout(),
    });

    res.removed.forEach(p => zip.remove(p));
    Object.keys(res.files).forEach(p => {
      if (res.files[p] !== files[p]) zip.file(p, res.files[p]);
    });

    const blob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'シフト' + year + '年' + month + '月.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    const info = res.info;
    let msg;
    if (info.templateRows === 0) {
      msg = 'Excelを出力しましたが、スタッフ欄を自動検出できませんでした。設定 →「Excel出力のスタッフ欄」で開始行・行数を指定してください';
    } else if (info.added > 0) {
      msg = `Excelを出力しました（テンプレ${info.templateRows}行 → ${info.staff}人分：${info.added}行追加）`;
    } else if (info.deleted > 0) {
      msg = `Excelを出力しました（テンプレ${info.templateRows}行 → ${info.staff}人分：${info.deleted}行削除）`;
    } else {
      msg = `Excelを出力しました（${info.staff}人・テンプレ書式を保持）`;
    }
    if (info.skippedFormulaCells.length > 0) {
      msg += `／数式セル${info.skippedFormulaCells.length}個は上書きせず保持`;
    }
    showToast(msg, info.templateRows === 0 || info.added || info.deleted || info.skippedFormulaCells.length ? 6000 : 2500);
  } catch (e) {
    console.error(e);
    showToast('Excel出力エラー: ' + e.message, 6000);
  }
}

/* ===== 月切り替え ===== */
function changeMonth(delta) {
  const { year, month } = parseMonth(state.currentMonth);
  let newM = month + delta;
  let newY = year;
  if (newM < 1) { newM = 12; newY--; }
  if (newM > 12) { newM = 1; newY++; }
  state.currentMonth = formatMonth(newY, newM);
  ensureMonthData(state.currentMonth);
  saveState();
  renderAll();
}

function copyPrevMonth() {
  const { year, month } = parseMonth(state.currentMonth);
  let prevM = month - 1;
  let prevY = year;
  if (prevM < 1) { prevM = 12; prevY--; }
  const prevKey = formatMonth(prevY, prevM);
  const prevData = state.months[prevKey];
  if (!prevData) {
    showToast('前月のデータがありません');
    return;
  }
  confirmDialog(`${prevY}年${prevM}月のシフトを今月にコピーします。\n（希望休・必須出勤・研修・有給はリセットされ、通常シフトのみコピーされます）`, () => {
    const md = state.months[state.currentMonth];
    const days = daysInMonth(state.currentMonth);
    md.shifts = {};
    // 通常出勤と休みのみコピー（ロック系・研修・有給はリセット）
    Object.keys(prevData.shifts).forEach(k => {
      const t = prevData.shifts[k];
      if (t === 'work' || t === 'off') {
        // 日数が違う場合は同じ日だけコピー
        const parts = k.split('_');
        const day = parseInt(parts[1]);
        if (day <= days) md.shifts[k] = t;
      }
    });
    // ★固定休曜日を持つスタッフ（ICスタッフ等）は日付コピーだと曜日がズレるため、
    //   曜日ベースで作り直す（固定曜日=休み、それ以外=出勤）
    state.staff.forEach(s => {
      const fixed = s.fixedOffDays || [];
      if (fixed.length === 0) return;
      for (let d = 1; d <= days; d++) {
        md.shifts[`${s.id}_${d}`] = fixed.includes(dayOfWeek(state.currentMonth, d)) ? 'off' : 'work';
      }
    });
    // 必要人数もコピー
    md.requiredStaff = prevData.requiredStaff.slice(0, days);
    while (md.requiredStaff.length < days) md.requiredStaff.push(0);
    saveState();
    renderAll();
    showToast('前月のシフトをコピーしました');
  });
}

<script>
/* ===== 一括必要人数設定 ===== */
function applyBulkRequired(scope) {
  const v = parseInt(document.getElementById('bulk-required').value);
  if (isNaN(v) || v < 0) { showToast('人数を入力してください'); return; }
  const ym = state.currentMonth;
  const days = daysInMonth(ym);
  const md = state.months[ym];
  const arr = md.requiredStaff;
  for (let d = 1; d <= days; d++) {
    const dow = dayOfWeek(ym, d);
    if (scope === 'all') arr[d - 1] = v;
    else if (scope === 'weekday' && dow >= 1 && dow <= 5) arr[d - 1] = v;
    else if (scope === 'weekend' && (dow === 0 || dow === 6)) arr[d - 1] = v;
  }
  saveState();
  renderCalendar();
  checkAndRenderViolations();
}

/* 日別メモの保存タイマー（入力連打で localStorage を叩きすぎないよう少し待つ） */
let memoSaveTimer = null;

/* ===== 全描画 ===== */
function renderAll() {
  document.getElementById('month-label').textContent =
    `${parseMonth(state.currentMonth).year}年${parseMonth(state.currentMonth).month}月`;
  renderSidebar();
  renderLegend();
  renderCalendar();
  checkAndRenderViolations();
  updateModeBar();
  updateSyncStatus();
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (sharedFolderHandle && !sharedFolderNeedsReauth) {
    const savedInfo = hasUnsavedChanges
      ? ' <span style="color:#D97706;font-weight:700;">未保存の変更あり</span>'
      : (lastSavedAt ? ` 保存済 ${lastSavedAt.toLocaleTimeString('ja-JP', { hour12: false, hour: '2-digit', minute: '2-digit' })}` : '');
    el.innerHTML = `<span style="color:${hasUnsavedChanges ? '#D97706' : '#059669'};">●</span> ${escapeHtml(sharedFolderName || '?')}${savedInfo}`;
    el.style.background = hasUnsavedChanges ? '#FFFBEB' : '#ECFDF5';
    el.style.borderColor = hasUnsavedChanges ? '#FCD34D' : '#A7F3D0';
    el.title = hasUnsavedChanges ? '未保存の変更があります（Ctrl+S で保存）' : 'クリックで設定を開く';
  } else if (sharedFolderHandle && sharedFolderNeedsReauth) {
    el.innerHTML = `<span style="color:#D97706;">⚠</span> 再承認待ち: ${escapeHtml(sharedFolderName || '?')}`;
    el.style.background = '#FEF3C7';
    el.style.borderColor = '#FCD34D';
    el.title = 'クリックして共有フォルダへのアクセスを再承認';
  } else {
    el.innerHTML = `<span style="color:#9CA3AF;">○</span> 未接続（このPCのみ）`;
    el.style.background = '#F9FAFB';
    el.style.borderColor = '#E5E7EB';
    el.title = 'クリックで設定を開く';
  }
  // 保存ボタンの未保存バッジも連動
  const badge = document.getElementById('save-badge');
  if (badge) badge.style.display = (sharedFolderHandle && hasUnsavedChanges) ? 'inline' : 'none';
}

/* ===== 初期化 ===== */
async function init() {
  loadState();

  // ヘッダーイベント
  document.getElementById('btn-prev-month').addEventListener('click', () => changeMonth(-1));
  document.getElementById('btn-next-month').addEventListener('click', () => changeMonth(1));
  document.getElementById('btn-copy-prev').addEventListener('click', copyPrevMonth);
  document.getElementById('btn-save').addEventListener('click', manualSave);
  document.getElementById('btn-export').addEventListener('click', exportToExcel);
  document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
  document.getElementById('sync-status').addEventListener('click', async () => {
    // 同期未確立だが保留中のハンドルがある場合、許可要求してみる
    if (!isFileSystemAccessSupported()) {
      openSettingsModal();
      return;
    }
    if (sharedFolderHandle) {
      // 再承認フラグが立ってる、または queryPermission が granted でない場合は requestPermission を試す
      let needReauth = sharedFolderNeedsReauth;
      if (!needReauth) {
        try {
          const perm = await sharedFolderHandle.queryPermission({ mode: 'readwrite' });
          needReauth = (perm !== 'granted');
        } catch (e) {
          console.warn('queryPermission on click failed:', e);
          needReauth = true;
        }
      }
      if (needReauth) {
        const ok = await requestPendingPermission();
        if (ok) return;
      }
    }
    openSettingsModal();
  });
  document.getElementById('btn-generate').addEventListener('click', () => {
    if (state.staff.length === 0) {
      showToast('スタッフを追加してください');
      return;
    }
    confirmDialog(
      '現在のシフトを上書きして自動生成します。\n（希望休・必須出勤・研修は保持されます）',
      async () => {
        try {
          await generateShifts();
        } catch (e) {
          console.error(e);
          hideLoading();
          showToast('生成エラー: ' + e.message);
        }
      }
    );
  });

  // サイドバー追加ボタン
  document.getElementById('btn-add-staff').addEventListener('click', () => openStaffModal(null));
  document.getElementById('btn-add-group').addEventListener('click', () => openGroupModal(null));

  // 一括必要人数
  document.getElementById('btn-apply-bulk').addEventListener('click', () => applyBulkRequired('all'));
  document.getElementById('btn-apply-weekday').addEventListener('click', () => applyBulkRequired('weekday'));
  document.getElementById('btn-apply-weekend').addEventListener('click', () => applyBulkRequired('weekend'));

  // モーダル外クリックで閉じる
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });

  // ドラッグ選択の終了（ドキュメント全体）
  document.addEventListener('mouseup', onDocumentMouseUp);

  // キーボード
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault(); // ブラウザの「ページを保存」を抑止
      manualSave();
      return;
    }
    if (e.key === 'Escape') {
      // モード解除 → 選択クリア → モーダル → ピッカーの順で処理
      if (currentMode !== null) { setMode(null); return; }
      if (selectedCells.size > 0) { clearSelection(); return; }
      closeModal();
      document.querySelectorAll('.cell-picker').forEach(p => p.remove());
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedCells.size > 0) {
      // テキスト入力中なら無視
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      e.preventDefault();
      selectedCells.forEach(key => {
        const [row, day] = key.split('_').map(Number);
        const staff = orderedStaffCache[row];
        if (!staff) return;
        setShift(staff.id, day, '');
      });
      saveState();
      clearSelection();
      renderCalendar();
      checkAndRenderViolations();
      showToast('選択範囲を消去しました');
    }
  });

  // 隠しコマンド: テンプレ再設定（ヘッダーロゴをShift+クリック）
  document.querySelector('.logo').addEventListener('click', (e) => {
    if (e.shiftKey) resetTemplate();
  });

  renderAll();

  // 旧テンプレデータを IndexedDB へ移行
  migrateTemplateIfNeeded();

  // 未保存の変更があるままタブを閉じようとしたら警告
  window.addEventListener('beforeunload', (e) => {
    if (sharedFolderHandle && hasUnsavedChanges) {
      e.preventDefault();
      e.returnValue = ''; // Chromium系で警告ダイアログを出すのに必要
    }
  });

  // 起動時：共有フォルダ選択画面を表示（前回フォルダへのワンクリック再接続付き）
  if (isFileSystemAccessSupported()) {
    showStartupFolderScreen().catch(e => console.error(e));
  }
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
